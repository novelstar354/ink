<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkescape</title>
<link rel="icon" href="inkescape.png" sizes="16x16" type="image/png" />   
<style>
:root {
  --tool-width:112px;--right-width:310px;--outliner-height:280px;--timeline-height:112px;--splitter-size:5px;
  --bg:#202124;--panel:#292a2d;--panel2:#34363a;
  --line:#45474c;--text:#e8eaed;--muted:#aeb3bb;
  --blue:#4c9ffe;--accent:#287edb;
}
html{user-select: none;
  -webkit-user-select: none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:13px Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{background:var(--panel2);color:var(--text);
border:1px solid var(--line);border-radius:4px;padding:7px;cursor:pointer}
button:hover{background:#45484e}
button.active{background:#175ea8;border-color:var(--blue)}
.topbar{height:44px;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:5px;padding:4px 8px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:thin;overscroll-behavior-x:contain;} 
.brand{font-weight:bold;font-size:16px;margin-right:12px;white-space:nowrap;position:sticky;left:0;z-index:20;flex:0 0 auto;background:var(--panel);padding:4px 8px 4px 0;align-self:stretch;display:flex;align-items:center;}
.workspace{display:grid;grid-template-columns:var(--tool-width) 1fr 265px;height:calc(100vh - 44px)}
.toolbar{background:var(--panel);border-right:1px solid var(--line);
display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:5px}
.tool{width:37px;height:37px;padding:0;font-size:17px;flex:0 0 37px}
/* 左ツールバー最上部に独立したモード切り替え */
.toolbar{overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:thin;}
.toolbar-mode-switch{position:sticky;top:-6px;z-index:10;background:var(--panel);}
.toolbar-mode-switch{width:100%;flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:3px;}
.toolbar-mode-switch button{width:100%;min-width:0;min-height:44px;padding:8px 7px;font-size:12px;font-weight:bold;line-height:1.25;white-space:nowrap;border-radius:5px;}
.toolbar-mode-switch .mode-badge{display:block;margin:1px 0 0;text-align:center;font-size:10px;line-height:1.2;overflow-wrap:anywhere;color:var(--muted);}
.toolbar>.tool-separator{flex:0 0 1px;}

.tool-separator{height:1px;background:var(--line);width:30px;margin:3px}
.center{position:relative;overflow:hidden;background:#1b1c1e}
.canvas-area{position:absolute;inset:0;overflow:auto;
background-image:radial-gradient(#444 0.7px,transparent .7px);background-size:15px 15px}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:900px;height:650px;background:white;box-shadow:0 5px 30px #0009}
#svg{width:100%;height:100%;display:block;touch-action:none}
.sidebar{background:var(--panel);border-left:1px solid var(--line);
overflow:auto;padding:11px}
.panel-title{font-weight:bold;font-size:14px;margin:5px 0 12px}
.section{border-top:1px solid var(--line);padding:11px 0}
.section h3{font-size:12px;color:var(--muted);margin:0 0 9px}
.field{display:flex;align-items:center;gap:7px;margin:7px 0}
.field label{width:65px;color:var(--muted);flex-shrink:0}
.field input[type=color]{width:43px;height:27px;padding:1px}
.field input[type=number],.field input[type=text],.field select{
min-width:0;flex:1;width:100%;background:#202124;color:white;
border:1px solid var(--line);border-radius:3px;padding:5px}
.field input[type=range]{flex:1;min-width:0}
.field span{min-width:35px;text-align:right;color:var(--muted)}
.full{width:100%}
.row-buttons{display:flex;gap:5px}
.row-buttons button{flex:1}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:5px;padding:6px;
background:#202124;border:1px solid var(--line);border-radius:3px}
.layer.selected{border-color:var(--blue)}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.layer button{padding:3px 6px}
.status{position:absolute;bottom:0;left:0;right:0;height:26px;
background:var(--panel);border-top:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
padding:0 10px;color:var(--muted);z-index:5}
#zoom{width:65px;background:#202124;color:white;border:1px solid var(--line)}
#textDialog{position:fixed;inset:0;background:#0009;display:none;
align-items:center;justify-content:center;z-index:20}
.dialog{background:var(--panel);padding:20px;border:1px solid var(--line);
border-radius:8px;width:min(350px,90vw)}
.dialog input{width:100%;padding:9px;margin:10px 0;background:#202124;
border:1px solid var(--line);color:white}
.dialog-actions{display:flex;justify-content:flex-end;gap:7px}
#selectionBox{fill:#1688ff;fill-opacity:.10;stroke:#1688ff;stroke-width:1.5;stroke-dasharray:5 3;pointer-events:none}
.node-handle{fill:white;stroke:#1688ff;stroke-width:2}
.node-handle.active{fill:#1688ff}
/* Blender風ワークスペース */
.workspace{height:calc(100vh - 44px - var(--timeline-height) - var(--splitter-size));grid-template-columns:var(--tool-width) var(--splitter-size) minmax(0,1fr) var(--splitter-size) var(--right-width);}
.sidebar{padding:0;display:grid;grid-template-rows:minmax(110px,var(--outliner-height)) var(--splitter-size) minmax(110px,1fr);overflow:hidden;gap:0;background:#252629;}
.outliner-panel{min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;border-bottom:1px solid #111;background:#292a2d;padding:9px;}
.outliner-panel>.outliner-heading{flex:0 0 27px;position:relative;z-index:2;background:#292a2d;}
.outliner-panel>.section{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;}
.outliner-heading,.properties-heading{height:27px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;color:#d8dbe0;margin-bottom:7px;}
.properties-panel{min-height:0;overflow:auto;padding:10px;background:#292a2d;}
.properties-panel .panel-title{display:none;}
.properties-panel .section:first-of-type{border-top:0;padding-top:3px;}
.timeline{height:var(--timeline-height);background:#252629;border-top:1px solid #111;display:flex;flex-direction:column;color:#c5c8ce;}
.timeline-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #414247;}
.timeline-track{position:relative;flex:1;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0,transparent 49px,#3b3d42 50px);}
.timeline-ruler{height:25px;border-bottom:1px solid #3b3d42;display:flex;justify-content:space-around;color:#8e949e;font-size:11px;padding-top:5px;}
.timeline-playhead{position:absolute;left:28%;top:0;bottom:0;width:1px;background:#e6a23c;}
.timeline-playhead:before{content:"";position:absolute;top:0;left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid #e6a23c;}
.timeline-head button{padding:4px 7px;font-size:11px;white-space:nowrap}
.timeline-setting{display:flex;align-items:center;gap:4px;color:#9da3ad;font-size:11px;white-space:nowrap}
.timeline-setting input,.timeline-setting select{width:58px;background:#1c1d20;color:#eee;border:1px solid #4a4d54;border-radius:3px;padding:3px}.timeline-setting select{width:95px}
.timeline-frame-label{margin-left:auto;color:#c5c8ce;white-space:nowrap;font-variant-numeric:tabular-nums}
.timeline-scroll{position:relative;flex:1;overflow:auto;min-height:0;background:#202124}
.timeline-content{position:relative;width:3180px;min-height:100%;}
.timeline-ruler{height:25px;display:block;position:relative;border-bottom:1px solid #45474c;background:#292a2d;}
.timeline-tick{position:absolute;top:0;height:100%;padding:5px 0 0 4px;border-left:1px solid #44474e;color:#9da3ad;font-size:10px;}
.timeline-rows{position:relative;}
.timeline-row{height:25px;border-bottom:1px solid #35373c;position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent 11px,#303238 12px);}
.timeline-row-label{position:sticky;left:0;display:inline-block;z-index:2;width:180px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#292a2d;border-right:1px solid #494b51;padding:5px 8px;height:24px;color:#c6c9cf;font-size:11px;}
.timeline-key{position:absolute;top:7px;width:10px;height:10px;background:#e6a23c;transform:rotate(45deg);border:1px solid #ffcf80;cursor:pointer;z-index:3;}
.timeline-key:hover{background:#fff0c4;}
.timeline-playhead{left:0;z-index:5;pointer-events:none;}
.timeline-empty{padding:9px;color:#777e89;font-size:11px;}
@media(max-width:700px){.timeline-head{gap:4px;padding:0 5px}.timeline-head button{padding:4px;font-size:10px}.timeline-setting{display:none}.timeline-frame-label{font-size:10px}}

#objectMenu{position:fixed;z-index:1000;display:none;min-width:150px;padding:5px;background:#303238;border:1px solid #555963;border-radius:6px;box-shadow:0 8px 24px #0009;}
#objectMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:4px;}
#objectMenu button:hover{background:#454a54;}
.mode-switch{display:flex;align-items:center;gap:4px;margin-left:8px;padding-left:9px;border-left:1px solid var(--line);white-space:nowrap;}
.mode-switch button{min-width:94px;}
.mode-switch button.active{background:#245b8e;border-color:#579bd7;}
.palette-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px;}
.palette-color{height:27px;min-width:0;padding:0;border:1px solid #737780;border-radius:4px;position:relative;}
.palette-color:hover{outline:2px solid var(--blue);outline-offset:1px;}
.palette-color.active{outline:2px solid #fff;outline-offset:1px;}
.palette-hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
.fill-mode-controls button{flex:1;}
.fill-mode-controls button.active{background:#245b8e;border-color:#579bd7;color:#fff;}
.layer.multi-selected{border-color:#78b7f5;background:#203b54;}
#objects .selected-object{filter:drop-shadow(0 0 2px #1688ff); }
.mode-badge{font-size:11px;color:#aeb3bb;margin-left:5px;}
.layer{min-height:31px;}
.layer-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;}
.layer-name-input{flex:1;min-width:0;width:0;background:#17181a;color:#fff;border:1px solid var(--blue);border-radius:3px;padding:4px;}
.layer-menu{width:25px;min-width:25px;padding:2px!important;font-size:17px;line-height:18px;}
@media(max-width:800px){
.workspace{grid-template-columns:84px var(--splitter-size) minmax(0,1fr) var(--splitter-size) 260px;height:calc(100vh - 44px - var(--timeline-height) - var(--splitter-size));}
.sidebar{display:grid;grid-template-rows:minmax(100px,var(--outliner-height)) var(--splitter-size) minmax(100px,1fr);}
.timeline{height:90px;}
.brand{font-size:13px;margin-right:3px}
.topbar{gap:2px}
}
@media(max-width:560px){.workspace{grid-template-columns:76px 0 minmax(0,1fr) 0 0;} .sidebar,.dock-splitter.vertical,.dock-splitter.horizontal:not(.timeline-splitter){display:none!important;} .timeline{height:var(--timeline-height);}}

/* フォルダ・階層表示 */

.layer.folder {
  border-color: #687b96;
  background: #252b35;
}

.layer.dragging {
  opacity: .4;
}

.layer.drop-target {
  outline: 2px solid var(--blue);
  background: #24476b;
}

.layer-children {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-left: 15px;
  padding-left: 8px;
  border-left: 1px solid var(--line);
}

.folder-toggle {
  min-width: 25px;
  width: 25px;
  padding: 3px !important;
  font-size: 12px;
}

.layer-name {
  min-width: 0;
}

/* リサイズ可能なドック */
.dock-splitter{background:#1b1c1e;position:relative;z-index:8;touch-action:none;user-select:none;}
.dock-splitter:hover,.dock-splitter.dragging{background:#397fbd;}
.dock-splitter.vertical{cursor:col-resize;border-left:1px solid #111;border-right:1px solid #111;}
.dock-splitter.horizontal{cursor:row-resize;border-top:1px solid #111;border-bottom:1px solid #111;}
.timeline-splitter{height:var(--splitter-size);width:100%;flex:none;}
.layout-control{display:flex;align-items:center;gap:5px;margin-left:auto;white-space:nowrap;}
.layout-control select{background:#202124;color:#eee;border:1px solid var(--line);border-radius:4px;padding:6px;max-width:150px;}
.layer.layer-root{background:#302f29;border-color:#76653b;}
.layer.active-layer .layer-name{color:#f2d38a;font-weight:700;}
.layer-root-mark{font-size:10px;color:#d7b56d;margin-left:4px;}
@media(max-width:800px){.layout-control{margin-left:4px}.layout-control select{max-width:105px}.layout-control span{display:none;}}


/* Blender風アプリケーションメニュー */
.app-menus{display:flex;align-items:center;gap:2px;white-space:nowrap;}
.app-menu-wrap{position:relative;flex-shrink:0;}
.topbar>*{flex-shrink:0;}
.app-menus{flex-shrink:0;}
.app-menu-trigger{background:transparent;border-color:transparent;padding:7px 9px;color:#d8dbe0;}
.app-menu-trigger:hover,.app-menu-trigger[aria-expanded="true"]{background:#3b3e44;border-color:#50545c;}
.app-menu{display:none;position:fixed;top:48px;left:8px;min-width:190px;padding:5px;background:#303238;border:1px solid #555963;border-radius:6px;box-shadow:0 9px 26px #000a;z-index:1200;}
.app-menu.open{display:block;}
.app-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;border-radius:4px;white-space:nowrap;}
.app-menu button:hover{background:#454a54;}
.modifier-list{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
.modifier-card{border:1px solid #454a53;border-radius:5px;background:#222428;padding:9px;}
.modifier-card-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.modifier-card-head strong{flex:1;font-size:12px;}
.modifier-card-head button{padding:3px 7px;font-size:11px;}
.modifier-card .field{margin:6px 0;}
.modifier-card .field label{width:58px;font-size:11px;}
.modifier-empty{font-size:11px;color:#9299a4;line-height:1.6;padding:6px 2px;}
@media(max-width:900px){.app-menu-trigger{padding:6px 5px;font-size:11px}.app-menus{gap:0}}
@media(max-width:700px){.app-menus{display:flex;}}


/* Canva風アニメーション編集タイムライン */
.timeline{min-height:55px;}
.timeline-head{flex-wrap:nowrap;overflow-x:auto;flex:none;}
.timeline-head strong{white-space:nowrap;color:#e4e7ec;margin-right:5px;}
.timeline-head button{border-radius:4px;background:#34373d;}
.timeline-head button:hover{background:#46515f;}
.timeline-scroll{background:#1e2024;}
.timeline-content{min-height:100%;}
.timeline-row{height:34px;background:repeating-linear-gradient(90deg,transparent 0,transparent 11px,#303238 12px);}
.timeline-row-label{height:33px;padding-top:9px;background:#292c31;}
.timeline-clip{position:absolute;top:5px;height:23px;left:180px;border:1px solid #4b82ad;border-radius:4px;background:linear-gradient(180deg,#315d7e,#24445f);opacity:.78;pointer-events:none;}
.timeline-key{top:12px;width:10px;height:10px;border-radius:2px;background:#f1b85b;border:1px solid #ffe0a1;touch-action:none;}
.timeline-key.dragging{background:#fff;border-color:#fff;box-shadow:0 0 0 4px #e6a23c44;}
.timeline-playhead{position:absolute;top:0;bottom:0;width:1px;background:#f0ad4e;z-index:5;pointer-events:none;}
.timeline-empty{padding:14px 190px;color:#9299a4;white-space:nowrap;}
@media(max-width:700px){.timeline-head{height:40px}.timeline-head button{font-size:10px}.timeline-row-label{width:125px;max-width:125px}.timeline-clip{left:125px}.timeline-empty{padding-left:130px}}


/* アウトライナー下部：左側カテゴリタブ＋右側設定 */
.properties-panel{display:flex;flex-direction:column;min-width:0;overflow:hidden;padding:0!important;}
.properties-panel>.panel-title{display:none!important;}
.properties-layout{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden;}
.properties-tabs{width:76px;flex:0 0 76px;display:flex;flex-direction:column;gap:3px;padding:7px 5px;background:#232529;border-right:1px solid #41444b;overflow-y:auto;}
.properties-tab{width:100%;min-height:53px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 2px;background:transparent;border:1px solid transparent;border-radius:5px;color:#aeb4bf;font-size:10px;line-height:1.15;}
.properties-tab:hover{background:#343941;color:#f1f3f5;}
.properties-tab.active{background:#263d53;border-color:#416d91;color:#e8f3ff;}
.properties-tab .tab-icon{font-size:18px;line-height:20px;}
.properties-tab .tab-label{white-space:normal;text-align:center;overflow-wrap:anywhere;}
.properties-content{flex:1;min-width:0;min-height:0;overflow:auto;padding:9px 10px;background:#292a2d;}
.properties-tab-pane[hidden]{display:none!important;}
.properties-tab-pane>.section:first-child{border-top:0;padding-top:3px;}
.properties-tab-pane .section{padding:10px 0;}
@media(max-width:800px){.properties-tabs{width:62px;flex-basis:62px;padding:5px 3px}.properties-tab{min-height:48px;font-size:9px}.properties-content{padding:7px;}}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">✦ Inkescape</div>
  <nav class="app-menus" aria-label="アプリケーションメニュー">
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="fileMenu">ファイル</button><div class="app-menu" id="fileMenu">
      <button onclick="newDocument();closeAppMenus()">新規作成</button><button onclick="$('importFile').click();closeAppMenus()">SVGを開く</button><button onclick="saveSVG();closeAppMenus()">SVGで保存</button><button onclick="exportPNG();closeAppMenus()">PNGで書き出し</button><button onclick="exportAnimatedSVG();closeAppMenus()">アニメーションSVG</button>
    </div></div>
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="editMenu">編集</button><div class="app-menu" id="editMenu">
      <button onclick="undo();closeAppMenus()">元に戻す</button><button onclick="redo();closeAppMenus()">やり直す</button><button onclick="duplicateSelected();closeAppMenus()">複製</button><button onclick="deleteSelected();closeAppMenus()">削除</button>
    </div></div>
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="addMenu">追加</button><div class="app-menu" id="addMenu">
      <button onclick="setTool('rect');closeAppMenus()">四角形</button><button onclick="setTool('ellipse');closeAppMenus()">円・楕円</button><button onclick="setTool('star');closeAppMenus()">星形</button><button onclick="setTool('line');closeAppMenus()">直線</button><button onclick="setTool('text');closeAppMenus()">テキスト</button><button onclick="$('imageFile').click();closeAppMenus()">画像</button>
    </div></div>
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="objectAppMenu">オブジェクト</button><div class="app-menu" id="objectAppMenu">
      <button onclick="groupSelected();closeAppMenus()">グループ化</button><button onclick="ungroupSelected();closeAppMenus()">グループ解除</button><button onclick="duplicateSelected();closeAppMenus()">複製</button><button onclick="deleteSelected();closeAppMenus()">削除</button>
    </div></div>
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="modifierAppMenu">モディファイアー</button><div class="app-menu" id="modifierAppMenu">
      <button onclick="addModifier('blur');closeAppMenus()">ぼかしを追加</button><button onclick="addModifier('shadow');closeAppMenus()">ドロップシャドウを追加</button><button onclick="addModifier('grayscale');closeAppMenus()">グレースケールを追加</button><button onclick="addModifier('hue');closeAppMenus()">色相回転を追加</button><hr><button onclick="addModifier('mirror');closeAppMenus()">ミラー</button><button onclick="addModifier('array');closeAppMenus()">配列</button><button onclick="addModifier('bevel');closeAppMenus()">ベベル風</button><button onclick="addModifier('outline');closeAppMenus()">アウトライン</button><button onclick="focusModifierPanel();closeAppMenus()">モディファイアーパネルを表示</button>
    </div></div>
    <div class="app-menu-wrap"><button class="app-menu-trigger" data-menu="viewMenu">表示</button><div class="app-menu" id="viewMenu">
      <button onclick="$('layoutPreset').value='standard';applyLayoutPreset();closeAppMenus()">標準レイアウト</button><button onclick="$('layoutPreset').value='canvas';applyLayoutPreset();closeAppMenus()">キャンバス重視</button><button onclick="$('layoutPreset').value='properties';applyLayoutPreset();closeAppMenus()">プロパティ重視</button><button onclick="$('layoutPreset').value='outliner';applyLayoutPreset();closeAppMenus()">アウトライナー重視</button>
    </div></div>
  </nav>
  <div class="layout-control"><span>レイアウト</span><select id="layoutPreset" title="選択すると自動で適用"><option value="standard">標準</option><option value="canvas">キャンバス重視</option><option value="properties">プロパティ重視</option><option value="outliner">アウトライナー重視</option></select></div>
  <button onclick="newDocument()">新規</button>
  <button onclick="$('importFile').click()">開く</button>
    <button onclick="$('imageFile').click()">🖼 画像追加</button>
<input
  id="imageFile"
  type="file"
  accept="image/png,image/jpeg,image/webp,image/gif"
  hidden
>

<script>

"use strict";

const $=id=>document.getElementById(id);
const svg=$("svg"),objects=$("objects"),defs=$("defs"),overlay=$("overlay");

let tool="select",selected=null,drawing=false,preview=null;
let editorMode="OBJECT";
let selectedObjects=new Set();
let start=null,points=[],drag=null,nodeDrag=null;
let marqueeRect=null,marqueeBase=new Set();
let zoom=1,history=[],historyIndex=-1,objectCounter=0;
let textPosition=null;
let activeLayer=null;
let layers=[];
$("objectName").addEventListener("change", () => {
  if (!selected) return;

  const name = $("objectName").value.trim();

  if (!name) {
    $("objectName").value =
      selected.dataset.name || selected.tagName;
    return;
  }

  selected.dataset.name = name;

  updateLayers();
  snapshot();
});
/* =====================================
   Inkescape 自動保存・復元
===================================== */

const INKESCAPE_STORAGE_KEY = "inkescape_drawing_v1";

function saveDrawing() {
  try {
    const data = {
      version: 1,
      objects: objects.innerHTML,
      defs: defs.innerHTML,
      layers,
      activeLayer,
      objectCounter,
      viewBox: svg.getAttribute("viewBox"),
      pageWidth: $("stage").style.width,
      pageHeight: $("stage").style.height,
      savedAt: new Date().toISOString()
    };

    localStorage.setItem(
      INKESCAPE_STORAGE_KEY,
      JSON.stringify(data)
    );

    $("statusText").textContent = "保存済み";
  } catch (error) {
    console.error("保存エラー:", error);
    $("statusText").textContent = "保存できませんでした";
  }
}

function loadDrawing() {
  try {
    const saved = localStorage.getItem(INKESCAPE_STORAGE_KEY);
    if (!saved) return false;

    const data = JSON.parse(saved);
    if (data.version !== 1) return false;

    objects.innerHTML = data.objects || "";
    defs.innerHTML = data.defs || "";

    layers = data.layers || [];
    activeLayer = data.activeLayer || null;
    objectCounter = data.objectCounter || 0;

    if (data.viewBox) {
      svg.setAttribute("viewBox", data.viewBox);
    }

    if (data.pageWidth) {
      $("stage").style.width = data.pageWidth;
      $("pageW").value = parseInt(data.pageWidth) || 900;
    }

    if (data.pageHeight) {
      $("stage").style.height = data.pageHeight;
      $("pageH").value = parseInt(data.pageHeight) || 650;
    }

    selected = null;
    overlay.innerHTML = "";

    updateLayers();
    updateProperties();

    $("statusText").textContent = "作品を復元しました";

    return true;

  } catch (error) {
    console.error("復元エラー:", error);
    return false;
  }
}

function clearDrawing() {
  if (!confirm("キャンバスをクリアしますか？")) return;

  objects.innerHTML = "";
  layers = [];
  activeLayer = null;
  ensureLayerStructure();
  selected = null;
  preview = null;
  points = [];
  drawing = false;
  drag = null;
  nodeDrag = null;
  overlay.innerHTML = "";

  updateLayers();
  updateProperties();

  snapshot();

  $("statusText").textContent = "キャンバスをクリアしました";
}

$("clearCanvas").addEventListener("click", clearDrawing);
function snapshot(){
  const state=JSON.stringify({
    objects:objects.innerHTML,
    defs:defs.innerHTML,
    layers:layers,
    activeLayer:activeLayer
  });
  if(history[historyIndex]===state)return;
  history=history.slice(0,historyIndex+1);
  history.push(state);
  if(history.length>60)history.shift();
  historyIndex=history.length-1;
  saveDrawing();
}
function restore(state) {
  const s = JSON.parse(state);

  objects.innerHTML = s.objects;
  defs.innerHTML = s.defs;
  objects.querySelectorAll("[data-modifiers]").forEach(applyModifiers);

  layers = s.layers || [];
  activeLayer = s.activeLayer || null;

  selected = null;
  selectedObjects.clear();
  refreshSelectionVisuals();

  updateLayers();
  updateProperties();

  saveDrawing();
}
function undo(){if(historyIndex>0)restore(history[--historyIndex])}
function redo(){if(historyIndex<history.length-1)restore(history[++historyIndex])}

function setTool(name){
  tool=name;
  document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===name));
  $("statusText").textContent=({
    select:"選択・移動",node:"ノード編集",line:"直線",
    polyline:"折れ線",freehand:"フリーハンド",bezier:"ベジェ曲線",
    rect:"四角形",ellipse:"楕円",star:"星形",text:"テキスト",hand:"キャンバス移動"
  })[name];
  overlay.innerHTML="";
}
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

function point(e){
  const p=svg.createSVGPoint();
  p.x=e.clientX;p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function createLayerGroup(name){
  const group=document.createElementNS(svg.namespaceURI,"g");
  const id="layer-"+(++objectCounter);
  group.dataset.id=id;group.dataset.name=name;group.dataset.folder="true";
  group.dataset.layerRoot="true";group.dataset.collapsed="false";group.dataset.layer=id;
  return group;
}
function getActiveLayerGroup(){
  let group=[...objects.children].find(el=>el.dataset.layerRoot==="true"&&el.dataset.id===activeLayer);
  if(!group)group=[...objects.children].find(el=>el.dataset.layerRoot==="true");
  if(!group){group=createLayerGroup("レイヤー 1");objects.append(group);activeLayer=group.dataset.id;}
  return group;
}
function appendToActiveLayer(el){const group=getActiveLayerGroup();group.append(el);el.dataset.layer=group.dataset.id;return el;}
function ensureLayerStructure(){
  let roots=[...objects.children].filter(el=>el.dataset.layerRoot==="true");
  if(!roots.length){
    const old=[...objects.children];const group=createLayerGroup("レイヤー 1");
    objects.append(group);old.forEach(el=>group.append(el));roots=[group];activeLayer=group.dataset.id;
  }else if(!roots.some(el=>el.dataset.id===activeLayer)){activeLayer=roots[0].dataset.id;}
  roots.forEach((root,i)=>{root.dataset.folder="true";root.dataset.layerRoot="true";if(!root.dataset.name)root.dataset.name="レイヤー "+(i+1);});
}

function make(tag,attrs={}){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  el.dataset.id="object-"+(++objectCounter);
  el.dataset.name=tag+" "+objectCounter;
  el.dataset.layer=activeLayer||"default";
  el.setAttribute("fill",tag==="path"?"none":$("fill").value);
  el.setAttribute("stroke",strokeEnabled?$("stroke").value:"none");
  el.setAttribute("stroke-width",$("strokeWidth").value);
  el.setAttribute("stroke-linecap",$("linecap").value);
  el.setAttribute("stroke-linejoin",$("linejoin").value);
  el.setAttribute("opacity",Number($("opacity").value)/100);
  if($("dash").value)el.setAttribute("stroke-dasharray",$("dash").value);
  if($("arrowStart").value)el.setAttribute("marker-start",$("arrowStart").value);
  if($("arrowEnd").value)el.setAttribute("marker-end",$("arrowEnd").value);
  return el;
}
/* =====================================
   Inkescape 画像アップロード
===================================== */

$("imageFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];

  if (!file) return;

  // 対応形式チェック
  const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "image/gif"
  ];

  if (!allowedTypes.includes(file.type)) {
    alert("PNG・JPEG・WebP・GIF形式の画像を選択してください。");
    e.target.value = "";
    return;
  }

  // LocalStorageの容量を考慮
  if (file.size > 1.5 * 1024 * 1024) {
    alert("画像サイズは1.5MB以下にしてください。");
    e.target.value = "";
    return;
  }

  try {
    const dataURL = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("画像を読み込めませんでした"));

      reader.readAsDataURL(file);
    });

    const image = new Image();

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("画像を開けませんでした"));
      image.src = dataURL;
    });

    // キャンバスに収まる大きさに調整
    const maxWidth = 500;
    const maxHeight = 400;

    const scale = Math.min(
      1,
      maxWidth / image.naturalWidth,
      maxHeight / image.naturalHeight
    );

    const width = image.naturalWidth * scale;
    const height = image.naturalHeight * scale;

    const viewBox = svg.viewBox.baseVal;

    const x = (viewBox.width - width) / 2;
    const y = (viewBox.height - height) / 2;

    // SVG画像オブジェクトを作成
    const el = make("image", {
      x,
      y,
      width,
      height
    });

    el.setAttribute("href", dataURL);
    el.setAttributeNS(
      "http://www.w3.org/1999/xlink",
      "xlink:href",
      dataURL
    );

    el.setAttribute("preserveAspectRatio", "xMidYMid meet");

    // オブジェクト名
    el.dataset.name = file.name;

    appendToActiveLayer(el);

    select(el);
    snapshot();

    $("statusText").textContent = "画像を追加しました";

  } catch (error) {
    console.error(error);
    alert("画像の追加に失敗しました。");
  }

  e.target.value = "";
});
function refreshSelectionVisuals(){
  objects.querySelectorAll("[data-id]").forEach(el=>{
    el.classList.toggle("selected-object",selectedObjects.has(el));
  });
}
function select(el){
  selectedObjects.clear();
  selected=el||null;
  if(selected){
    selectedObjects.add(selected);
    const owner=selected.closest('[data-layer-root="true"]');
    if(owner)activeLayer=owner.dataset.id;
  }
  refreshSelectionVisuals();
  updateLayers();updateProperties();
  if(typeof renderTimeline==="function")renderTimeline();
}
function toggleMultiSelection(el){
  if(!el)return;
  if(selectedObjects.has(el))selectedObjects.delete(el);
  else selectedObjects.add(el);
  selected=[...selectedObjects].at(-1)||null;
  refreshSelectionVisuals();
  updateLayers();updateProperties();
  if(typeof renderTimeline==="function")renderTimeline();
}
function getSelectedObjects(){
  return [...selectedObjects].filter(el=>el&&el.isConnected);
}
function setMode(mode){
  editorMode=mode;
  $("objectModeBtn").classList.toggle("active",mode==="OBJECT");
  $("editModeBtn").classList.toggle("active",mode==="EDIT");
  $("modeBadge").textContent=mode==="OBJECT"?"Object":"Edit";
  if(mode==="EDIT"){
    setTool("select");
    const target=selected;
    if(target&&target.tagName.toLowerCase()==="path"){
      drawNodes(target);
      $("statusText").textContent="編集モード：ノードをドラッグ";
    }else{
      overlay.innerHTML="";
      $("statusText").textContent="編集モード：パスを選択してください";
    }
  }else{
    setTool("select");
    overlay.innerHTML="";
    $("statusText").textContent="オブジェクトモード：Shift+クリックで複数選択";
  }
}
// キャンバス表示領域が変わった場合もノード表示を再配置
let nodeOverlayRAF=0;
function scheduleNodeOverlayRefresh(){
  if(editorMode!=="EDIT"||!selected||selected.tagName.toLowerCase()!=="path")return;
  cancelAnimationFrame(nodeOverlayRAF);
  nodeOverlayRAF=requestAnimationFrame(()=>drawNodes(selected));
}
new ResizeObserver(scheduleNodeOverlayRefresh).observe($("canvasArea"));
$("canvasArea").addEventListener("scroll",scheduleNodeOverlayRefresh);
window.addEventListener("resize",scheduleNodeOverlayRefresh);

function updateProperties(){
  if(!selected){
    $("objectName").value="";
    return;
  }
  $("objectName").value = selectedObjects.size>1 ? `${selectedObjects.size}個を選択中` : (selected.dataset.name || selected.tagName);
  const fill=selected.getAttribute("fill");
  const stroke=selected.getAttribute("stroke");
  if(typeof fillEnabled!=="undefined"){
    fillEnabled=fill!=="none";
    updateFillModeButtons();
  }
  if(fill&&fill.startsWith("#"))$("fill").value=fill;
  if(stroke&&stroke.startsWith("#"))$("stroke").value=stroke;
  if(typeof strokeEnabled!=="undefined"){
    strokeEnabled=stroke!=="none";
    updateStrokeModeButtons();
  }
  renderModifierList();
  $("strokeWidth").value=selected.getAttribute("stroke-width")||0;
  $("opacity").value=Number(selected.getAttribute("opacity")||1)*100;
  $("opacityValue").textContent=$("opacity").value+"%";
  try{
    const b=getRootBBox(selected);
    $("posX").value=Math.round(b.x);
    $("posY").value=Math.round(b.y);
    $("objW").value=Math.round(b.width);
    $("objH").value=Math.round(b.height);
  }catch{}
}
function applyPaletteColor(color){
  $("fill").value=color;
  fillEnabled=true;
  const targets=getSelectedObjects();
  targets.forEach(el=>el.setAttribute("fill",color));
  updateFillModeButtons();
  if(targets.length)snapshot();
}
$("paletteGrid").addEventListener("click",e=>{
  const swatch=e.target.closest("[data-color]");
  if(!swatch)return;
  applyPaletteColor(swatch.dataset.color);
  $("paletteGrid").querySelectorAll(".palette-color").forEach(b=>b.classList.toggle("active",b===swatch));
});
let fillEnabled=true;
function updateFillModeButtons(){
  $("fillEnabledBtn")?.classList.toggle("active",fillEnabled);
  $("fillDisabledBtn")?.classList.toggle("active",!fillEnabled);
}
function setFillEnabled(enabled){
  fillEnabled=!!enabled;
  const value=fillEnabled?$("fill").value:"none";
  const targets=getSelectedObjects();
  targets.forEach(el=>el.setAttribute("fill",value));
  updateFillModeButtons();
  if(targets.length)snapshot();
}
function setFill(v){
  if(v==="none"){setFillEnabled(false);return;}
  if(v)$("fill").value=v;
  setFillEnabled(true);
}
let strokeEnabled=true;
function updateStrokeModeButtons(){
  $("strokeEnabledBtn")?.classList.toggle("active",strokeEnabled);
  $("strokeDisabledBtn")?.classList.toggle("active",!strokeEnabled);
}
function setStrokeEnabled(enabled){
  strokeEnabled=!!enabled;
  const value=strokeEnabled?$("stroke").value:"none";
  const targets=getSelectedObjects();
  targets.forEach(el=>el.setAttribute("stroke",value));
  updateStrokeModeButtons();
  if(targets.length)snapshot();
}
function setStroke(v){
  if(v==="none"){setStrokeEnabled(false);return;}
  if(v)$("stroke").value=v;
  setStrokeEnabled(true);
}
updateFillModeButtons();
updateStrokeModeButtons();

["fill","stroke","strokeWidth","opacity","linecap","linejoin","dash","arrowStart","arrowEnd"].forEach(id=>{
  $(id).addEventListener("input",()=>{
    if(id==="fill" && fillEnabled){
      const targets=getSelectedObjects();
      targets.forEach(el=>{if(el.getAttribute("fill")!=="none")el.setAttribute("fill",$("fill").value);});
      if(targets.length)snapshot();
    }
    const targets=getSelectedObjects();
    if(!targets.length)return;
    if(id==="stroke" && !strokeEnabled)return;
    const attrs={
      fill:"fill",stroke:"stroke",strokeWidth:"stroke-width",
      opacity:"opacity",linecap:"stroke-linecap",linejoin:"stroke-linejoin",
      dash:"stroke-dasharray",arrowStart:"marker-start",arrowEnd:"marker-end"
    };
    let v=$(id).value;
    if(id==="opacity"){
      v=Number(v)/100;
      $("opacityValue").textContent=$(id).value+"%";
    }
    targets.forEach(el=>{
      if(v==="")el.removeAttribute(attrs[id]);
      else el.setAttribute(attrs[id],v);
    });
    snapshot();
  });
});

function pointerDown(e){
  if(e.button!==0)return;
  const p=point(e);
  const target=e.target.closest("[data-id]");

  if(tool==="text"){openText(p);return}
  if(tool==="hand")return;

  if(tool==="select"){
    if(target&&objects.contains(target)){
      if(editorMode==="EDIT"){
        select(target);
        if(target.tagName.toLowerCase()==="path")drawNodes(target);
        else $("statusText").textContent="編集モードではパスを選択してください";
        return;
      }
      if(e.shiftKey){
        toggleMultiSelection(target);
        if(!selectedObjects.has(target))return;
      }else if(!selectedObjects.has(target)||selectedObjects.size>1){
        select(target);
      }
      // 選択中のオブジェクトをひとまとまりとして移動する。
      // 親グループとその子が同時選択されている場合は、二重移動を防ぐため親だけを動かす。
      const selectedNow=getSelectedObjects();
      const targets=selectedNow.filter(el=>!selectedNow.some(other=>other!==el&&other.contains(el)));
      drag={type:"object",x:p.x,y:p.y,items:targets.map(el=>({
        el,
        oldTransform:el.getAttribute("transform")||"",
        parentCTM:el.parentElement?.getCTM?.()||svg.getCTM()
      }))};
      if(selectedNow.length>1)$("statusText").textContent=`${selectedNow.length}個のオブジェクトをまとめて移動`;
      svg.setPointerCapture(e.pointerId);
    }else if(editorMode==="OBJECT"){
      // 空白からドラッグすると範囲選択。Shift併用時は既存選択に追加する。
      if(!e.shiftKey)select(null);
      marqueeBase=e.shiftKey?new Set(selectedObjects):new Set();
      marqueeRect=document.createElementNS(svg.namespaceURI,"rect");
      marqueeRect.setAttribute("id","selectionBox");
      marqueeRect.setAttribute("x",p.x);marqueeRect.setAttribute("y",p.y);
      marqueeRect.setAttribute("width",0);marqueeRect.setAttribute("height",0);
      overlay.appendChild(marqueeRect);
      drag={type:"marquee",x:p.x,y:p.y};
      svg.setPointerCapture(e.pointerId);
    }
    return;
  }

  if(tool==="node"){
    if(target&&objects.contains(target)&&target.tagName.toLowerCase()==="path"){
      select(target);drawNodes(target);
    }else if(selected)drawNodes(selected);
    return;
  }

  if(tool==="polyline"){
    if(!preview){
      preview=make("path");
      preview.setAttribute("fill","none");
      preview.setAttribute("d",`M ${p.x} ${p.y}`);
      appendToActiveLayer(preview);
      points=[p];
    }else{
      points.push(p);
      updatePolyline();
    }
    return;
  }

  if(tool==="bezier"){
    if(!preview){
      preview=make("path");
      preview.setAttribute("fill","none");
      points=[{x:p.x,y:p.y,c1:null,c2:null}];
      appendToActiveLayer(preview);
      updateBezier();
    }else{
      points.push({x:p.x,y:p.y,c1:null,c2:null});
      updateBezier();
    }
    return;
  }

  drawing=true;start=p;
  points=[p];
  if(tool==="freehand"){
    preview=make("path");
    preview.setAttribute("fill","none");
    preview.setAttribute("d",`M ${p.x} ${p.y}`);
    appendToActiveLayer(preview);
  }else if(tool==="line"){
    preview=make("path");
    preview.setAttribute("fill","none");
    appendToActiveLayer(preview);
  }else if(tool==="rect"||tool==="ellipse"||tool==="star"){
    preview=make(tool==="rect"?"rect":tool==="ellipse"?"ellipse":"path");
    // 星は閉じた図形として扱い、塗りの有無を反映する
    if(tool==="star") preview.setAttribute("fill",fillEnabled?$("fill").value:"none");
    appendToActiveLayer(preview);
  }
  svg.setPointerCapture(e.pointerId);
}

function pointerMove(e){
  const p=point(e);
  if(drag&&drag.type==="marquee"){
    const x=Math.min(drag.x,p.x),y=Math.min(drag.y,p.y);
    marqueeRect?.setAttribute("x",x);marqueeRect?.setAttribute("y",y);
    marqueeRect?.setAttribute("width",Math.abs(p.x-drag.x));
    marqueeRect?.setAttribute("height",Math.abs(p.y-drag.y));
    return;
  }
  if(drag&&drag.type==="object"){
    const dx=p.x-drag.x,dy=p.y-drag.y;
    drag.items.forEach(item=>{
      // SVGルート座標の移動量を各オブジェクトの親座標へ変換する。
      // これにより拡大・回転されたレイヤー内でも複数選択がずれずに移動する。
      const inv=item.parentCTM?.inverse?.();
      const localX=inv?inv.a*dx+inv.c*dy:dx;
      const localY=inv?inv.b*dx+inv.d*dy:dy;
      item.el.setAttribute("transform",`translate(${localX} ${localY}) ${item.oldTransform}`.trim());
    });
    return;
  }
  if(nodeDrag&&selected){
    moveNode(p);
    return;
  }
  if(!drawing||!preview)return;

  if(tool==="freehand"){
    points.push(p);
    preview.setAttribute("d",points.map((q,i)=>(i?"L ":"M ")+q.x+" "+q.y).join(" "));
    return;
  }

  let x=p.x,y=p.y;
  if(e.shiftKey){
    const dx=x-start.x,dy=y-start.y;
    const angle=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
    const len=Math.hypot(dx,dy);
    x=start.x+Math.cos(angle)*len;
    y=start.y+Math.sin(angle)*len;
  }
  if(tool==="line"){
    preview.setAttribute("d",`M ${start.x} ${start.y} L ${x} ${y}`);
  }else if(tool==="rect"){
    preview.setAttribute("x",Math.min(start.x,x));
    preview.setAttribute("y",Math.min(start.y,y));
    preview.setAttribute("width",Math.abs(x-start.x));
    preview.setAttribute("height",Math.abs(y-start.y));
  }else if(tool==="ellipse"){
    preview.setAttribute("cx",(start.x+x)/2);
    preview.setAttribute("cy",(start.y+y)/2);
    preview.setAttribute("rx",Math.abs(x-start.x)/2);
    preview.setAttribute("ry",Math.abs(y-start.y)/2);
  }else if(tool==="star"){
    preview.setAttribute("d",starPath(start.x,start.y,Math.hypot(x-start.x,y-start.y)));
  }
}
function pointerUp(){
  if(drag&&drag.type==="marquee"){
    const box=marqueeRect?{
      x:Number(marqueeRect.getAttribute("x")),y:Number(marqueeRect.getAttribute("y")),
      width:Number(marqueeRect.getAttribute("width")),height:Number(marqueeRect.getAttribute("height"))
    }:null;
    marqueeRect?.remove();marqueeRect=null;
    if(box&&(box.width>2||box.height>2)){
      const candidates=[...objects.children].filter(el=>el.dataset.layerRoot==="true").flatMap(root=>[...root.children]);
      const flat=candidates.length?candidates:[...objects.children];
      const found=flat.filter(el=>el.dataset.id&&el.dataset.guide!=="true").filter(el=>{
        try{const b=getRootBBox(el);return b.x<=box.x+box.width&&b.x+b.width>=box.x&&b.y<=box.y+box.height&&b.y+b.height>=box.y;}catch{return false;}
      });
      selectedObjects=new Set([...marqueeBase,...found]);
      selected=[...selectedObjects].at(-1)||null;
      refreshSelectionVisuals();updateLayers();updateProperties();
      if(typeof renderTimeline==="function")renderTimeline();
      $("statusText").textContent=`${found.length}個のオブジェクトを範囲選択`;
    }
    drag=null;return;
  }
  if(drag){drag=null;snapshot();return}
  if(nodeDrag){nodeDrag=null;snapshot();return}
  if(!drawing)return;
  drawing=false;
  if(preview){
    select(preview);
    preview=null;
    snapshot();
  }
}
svg.addEventListener("pointerdown",pointerDown);
svg.addEventListener("pointermove",pointerMove);
svg.addEventListener("pointerup",pointerUp);
svg.addEventListener("pointercancel",pointerUp);

function starPath(cx,cy,r){
  let d="";
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5;
    const rr=i%2?r*.45:r;
    d+=(i?"L":"M")+(cx+Math.cos(a)*rr)+" "+(cy+Math.sin(a)*rr)+" ";
  }
  return d+"Z";
}
function updatePolyline(){
  if(!preview)return;
  preview.setAttribute("d",points.map((p,i)=>(i?"L ":"M ")+p.x+" "+p.y).join(" "));
}
function updateBezier(){
  if(!preview)return;
  let d=`M ${points[0].x} ${points[0].y}`;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i];
    if(a.c2||b.c1){
      const c1=a.c2||a,c2=b.c1||b;
      d+=` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
    }else d+=` L ${b.x} ${b.y}`;
  }
  preview.setAttribute("d",d);
}
function finishPath(){
  if(!preview)return;
  select(preview);
  preview=null;points=[];
  snapshot();
}
svg.addEventListener("dblclick",()=>{
  if(tool==="polyline"||tool==="bezier")finishPath();
});
function cancelPath(){
  if(preview){preview.remove();preview=null;points=[];drawing=false}
}

function pathNumberPairs(d){
  const nums=(d.match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[]).map(Number);
  const pairs=[];for(let i=0;i+1<nums.length;i+=2)pairs.push({x:nums[i],y:nums[i+1]});
  return pairs;
}
function drawNodes(el){
  overlay.replaceChildren();
  if(!el||el.tagName.toLowerCase()!=="path")return;
  try{
    const elementCTM=el.getScreenCTM(),svgCTM=svg.getScreenCTM();
    if(!elementCTM||!svgCTM)return;
    // パス自身や親グループのtransformを反映して、SVGルート座標へ変換する
    const toSvg=svgCTM.inverse().multiply(elementCTM);
    pathNumberPairs(el.getAttribute("d")||"").forEach((pt,i)=>{
      const mapped=new DOMPoint(pt.x,pt.y).matrixTransform(toSvg);
      const c=document.createElementNS(svg.namespaceURI,"circle");
      c.setAttribute("cx",mapped.x);c.setAttribute("cy",mapped.y);
      c.setAttribute("r",5);c.setAttribute("class","node-handle");
      c.dataset.node=i;
      c.addEventListener("pointerdown",e=>{
        e.stopPropagation();e.preventDefault();
        nodeDrag={index:i};
        svg.setPointerCapture(e.pointerId);
      });
      overlay.append(c);
    });
  }catch(err){console.warn("ノード位置の変換に失敗しました",err)}
}
function moveNode(p){
  if(!selected||!nodeDrag)return;
  const d=selected.getAttribute("d")||"";
  const pairs=pathNumberPairs(d),pt=pairs[nodeDrag.index];
  if(!pt)return;
  try{
    // ポインターはSVGルート座標なので、パスのローカル座標に戻してから更新
    const toLocal=selected.getScreenCTM().inverse().multiply(svg.getScreenCTM());
    const local=new DOMPoint(p.x,p.y).matrixTransform(toLocal);
    const nums=d.match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[];
    const replacements=[];for(let i=0;i+1<nums.length;i+=2)replacements.push([i,local.x],[i+1,local.y]);
    let index=0;
    const newD=d.replace(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g,()=>{
      const pairIndex=Math.floor(index/2);const axis=index%2;index++;
      if(pairIndex!==nodeDrag.index)return nums[index-1];
      return String(axis===0?local.x:local.y);
    });
    selected.setAttribute("d",newD);
    drawNodes(selected);
  }catch(err){console.warn("ノード編集に失敗しました",err)}
}

function closeAppMenus(){
  document.querySelectorAll(".app-menu.open").forEach(menu=>menu.classList.remove("open"));
  document.querySelectorAll(".app-menu-trigger").forEach(btn=>btn.setAttribute("aria-expanded","false"));
}
document.querySelectorAll(".app-menu-trigger").forEach(btn=>btn.addEventListener("click",e=>{
  e.stopPropagation();
  const target=$(btn.dataset.menu),wasOpen=target.classList.contains("open");
  closeAppMenus();
  if(!wasOpen){
    const rect=btn.getBoundingClientRect();
    target.style.left=Math.max(6,Math.min(rect.left,window.innerWidth-200))+"px";
    target.style.top=Math.min(rect.bottom+3,window.innerHeight-80)+"px";
    target.classList.add("open");btn.setAttribute("aria-expanded","true");
  }
}));

const MODIFIER_NAMES={blur:"ぼかし",shadow:"ドロップシャドウ",grayscale:"グレースケール",hue:"色相回転",mirror:"ミラー",array:"配列",bevel:"ベベル風",outline:"アウトライン"};
function getModifiers(el){try{return JSON.parse(el?.dataset.modifiers||"[]");}catch{return [];}}
function clearModifierClones(el){
  const id=el?.dataset.id;if(!id||!el.parentNode)return;
  [...el.parentNode.children].filter(n=>n.dataset?.modifierOwner===id).forEach(n=>n.remove());
}
function applyModifiers(el){
  if(!el)return;
  const mods=getModifiers(el),id=el.dataset.id||("modifier-"+Math.random().toString(36).slice(2));el.dataset.id=id;
  clearModifierClones(el);
  const filterId="filter-"+id.replace(/[^a-zA-Z0-9_-]/g,"-");
  let filter=defs.querySelector("#"+CSS.escape(filterId));if(filter)filter.remove();
  const active=mods.filter(mod=>mod.enabled!==false);
  if(active.some(m=>["blur","shadow","grayscale","hue","outline"].includes(m.type))){
    filter=document.createElementNS(svg.namespaceURI,"filter");filter.id=filterId;filter.setAttribute("x","-80%");filter.setAttribute("y","-80%");filter.setAttribute("width","260%");filter.setAttribute("height","260%");
    active.forEach(mod=>{
      if(mod.type==="blur"){const f=document.createElementNS(svg.namespaceURI,"feGaussianBlur");f.setAttribute("stdDeviation",Math.max(0,Number(mod.value)||0));f.setAttribute("in","SourceGraphic");f.setAttribute("result","blur");filter.append(f);}
      else if(mod.type==="shadow"){const f=document.createElementNS(svg.namespaceURI,"feDropShadow");f.setAttribute("dx",Number(mod.x)||3);f.setAttribute("dy",Number(mod.y)||3);f.setAttribute("stdDeviation",Math.max(0,Number(mod.value)||3));f.setAttribute("flood-color",mod.color||"#000000");f.setAttribute("flood-opacity",mod.opacity??"0.45");filter.append(f);}
      else if(mod.type==="grayscale"){const f=document.createElementNS(svg.namespaceURI,"feColorMatrix");f.setAttribute("type","saturate");f.setAttribute("values","0");filter.append(f);}
      else if(mod.type==="hue"){const f=document.createElementNS(svg.namespaceURI,"feColorMatrix");f.setAttribute("type","hueRotate");f.setAttribute("values",Number(mod.value)||0);filter.append(f);}
      else if(mod.type==="outline"){const f=document.createElementNS(svg.namespaceURI,"feMorphology");f.setAttribute("in","SourceAlpha");f.setAttribute("operator","dilate");f.setAttribute("radius",Math.max(0.2,Number(mod.value)||1));f.setAttribute("result","expanded");const merge=document.createElementNS(svg.namespaceURI,"feMerge");const n1=document.createElementNS(svg.namespaceURI,"feMergeNode");n1.setAttribute("in","expanded");const n2=document.createElementNS(svg.namespaceURI,"feMergeNode");n2.setAttribute("in","SourceGraphic");merge.append(n1,n2);filter.append(f,merge);}
    });
    defs.append(filter);el.setAttribute("filter",`url(#${filterId})`);
  }else el.removeAttribute("filter");
  // 形状系モディファイアーは編集可能な元オブジェクトを残し、表示用コピーを追加する
  const bbox=(()=>{try{return el.getBBox();}catch{return {x:0,y:0,width:0,height:0};}})();
  active.forEach(mod=>{
    if(mod.type==="bevel"){
      if(!el.dataset.baseLinejoin)el.dataset.baseLinejoin=el.getAttribute("stroke-linejoin")||"miter";
      el.setAttribute("stroke-linejoin","round");
      if(el.tagName.toLowerCase()==="rect"){if(el.dataset.baseRx===undefined)el.dataset.baseRx=el.getAttribute("rx")||"0";if(el.dataset.baseRy===undefined)el.dataset.baseRy=el.getAttribute("ry")||"0";const r=Math.max(0,Number(mod.value)||8);el.setAttribute("rx",String(r));el.setAttribute("ry",String(r));}
    }
    if(mod.type==="mirror"||mod.type==="array"){
      const count=mod.type==="mirror"?1:Math.max(1,Math.min(20,Number(mod.count)||3));
      for(let i=1;i<=count;i++){
        const wrapper=document.createElementNS(svg.namespaceURI,"g");wrapper.dataset.modifierOwner=id;wrapper.style.pointerEvents="none";wrapper.setAttribute("aria-hidden","true");
        const clone=el.cloneNode(true);clone.removeAttribute("id");clone.removeAttribute("filter");clone.removeAttribute("data-modifiers");clone.removeAttribute("data-id");clone.removeAttribute("data-name");clone.removeAttribute("data-layer");clone.removeAttribute("data-selected");clone.removeAttribute("data-modifiers");
        if(mod.type==="mirror"){
          const axis=mod.axis||"x";
          if(axis==="y")wrapper.setAttribute("transform",`translate(0 ${2*bbox.y+bbox.height}) scale(1 -1)`);
          else if(axis==="both")wrapper.setAttribute("transform",`translate(${2*bbox.x+bbox.width} ${2*bbox.y+bbox.height}) scale(-1 -1)`);
          else wrapper.setAttribute("transform",`translate(${2*bbox.x+bbox.width} 0) scale(-1 1)`);

function alignSelected(mode){
  if(!selected)return;
  const b=selected.getBBox();
  const page=svg.viewBox.baseVal;
  let dx=0,dy=0;
  if(mode==="left")dx=-b.x;
  if(mode==="center")dx=page.width/2-(b.x+b.width/2);
  if(mode==="right")dx=page.width-b.x-b.width;
  if(mode==="top")dy=-b.y;
  if(mode==="middle")dy=page.height/2-(b.y+b.height/2);
  if(mode==="bottom")dy=page.height-b.y-b.height;
  const old=selected.getAttribute("transform")||"";
  selected.setAttribute("transform",`translate(${dx} ${dy}) ${old}`.trim());
  snapshot();
}
function removeObjectElement(el){
  if(!el)return;
  if(el.dataset.layerRoot==="true"){
    const roots=[...objects.children].filter(item=>item.dataset.layerRoot==="true");
    if(roots.length<=1){
      el.replaceChildren();
      activeLayer=el.dataset.id;
    }else{
      const next=roots.find(item=>item!==el);
      el.remove();
      if(activeLayer===el.dataset.id)activeLayer=next?.dataset.id||null;
    }
    layers=layers.filter(layer=>layer.id!==el.dataset.id);
  }else el.remove();
}

function deleteSelected(){
  const targets=getSelectedObjects();
  if(!targets.length)return;
  // 親グループとその子が同時選択されている場合は親だけ削除する
  const topLevel=targets.filter(el=>!targets.some(other=>other!==el&&other.contains(el)));
  topLevel.forEach(removeObjectElement);
  select(null);updateLayers();snapshot();
}
function duplicateSelected(){
  if(!selected||selected.dataset.layerRoot==="true")return;

  clone.dataset.id="object-"+(++objectCounter);
  clone.dataset.name=(selected.dataset.name||"Object")+" コピー";
  const old=clone.getAttribute("transform")||"";
  clone.setAttribute("transform",`translate(20 20) ${old}`.trim());

}
function moveOrder(direction){

  else parent.insertBefore(selected,parent.firstChild);

// 要素の現在の表示位置・サイズをSVGルート座標で取得する
function getRootBBox(el){
  const b=el.getBBox();
  const m=el.getCTM();
  if(!m)return {x:b.x,y:b.y,width:b.width,height:b.height};
  const pts=[
    new DOMPoint(b.x,b.y).matrixTransform(m),
    new DOMPoint(b.x+b.width,b.y).matrixTransform(m),
    new DOMPoint(b.x,b.y+b.height).matrixTransform(m),
    new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m)
  ];
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x=Math.min(...xs),y=Math.min(...ys);
  return {x,y,width:Math.max(...xs)-x,height:Math.max(...ys)-y};
}
let geometrySnapshotTimer=null;
function applyGeometry(){
  if(!selected)return;
  const vals=["posX","posY","objW","objH"].map(id=>$(id).value);
  if(vals.some(v=>v===""||!Number.isFinite(Number(v))))return;
  const b=getRootBBox(selected);
  const x=Number($("posX").value),y=Number($("posY").value);
  const w=Math.max(1,Number($("objW").value));
  const h=Math.max(1,Number($("objH").value));
  if(!b.width||!b.height)return;
  // 親グループの変形を保ちながら、現在の表示範囲を指定値へ写像する
  const rootMap=new DOMMatrix().translate(x,y).scale(w/b.width,h/b.height).translate(-b.x,-b.y);
  const parentCTM=selected.parentElement?.getCTM?.()||svg.getCTM();
  const elementCTM=selected.getCTM();
  if(!parentCTM||!elementCTM)return;
  const localMatrix=parentCTM.inverse().multiply(rootMap).multiply(elementCTM);
  selected.setAttribute("transform",`matrix(${[localMatrix.a,localMatrix.b,localMatrix.c,localMatrix.d,localMatrix.e,localMatrix.f].join(" ")})`);
  refreshSelectionVisuals?.();
  clearTimeout(geometrySnapshotTimer);
  geometrySnapshotTimer=setTimeout(()=>{snapshot();updateLayers();},250);
}
["posX","posY","objW","objH"].forEach(id=>{
  const field=$(id);
  field.addEventListener("input",applyGeometry);
  field.addEventListener("change",()=>{applyGeometry();clearTimeout(geometrySnapshotTimer);snapshot();updateProperties();});
});
function applyGradient(){
  if(!selected)return;
  const id="gradient-"+Date.now();
  const g=document.createElementNS(svg.namespaceURI,"linearGradient");
  g.id=id;
  g.setAttribute("x1","0%");g.setAttribute("y1","0%");
  g.setAttribute("x2","100%");g.setAttribute("y2","100%");
  for(const [offset,color] of [["0%",$("gradA").value],["100%",$("gradB").value]]){
    const stop=document.createElementNS(svg.namespaceURI,"stop");
    stop.setAttribute("offset",offset);stop.setAttribute("stop-color",color);
    g.append(stop);
  }
  defs.append(g);
  selected.setAttribute("fill",`url(#${id})`);
  snapshot();
}
function resizePage(){
  const w=Math.max(1,Number($("pageW").value));
  const h=Math.max(1,Number($("pageH").value));
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  $("stage").style.width=w+"px";
  $("stage").style.height=h+"px";
  snapshot();
}
function changeZoom(n){
  zoom=Math.max(.2,Math.min(3,zoom+n));
  $("stage").style.transform=`translate(-50%,-50%) scale(${zoom})`;
  $("zoom").value=Math.round(zoom*100)+"%";
}
function newDocument(){
  if(!confirm("現在の作品を消去しますか？"))return;
  if(typeof stopTimelinePlayback==="function")stopTimelinePlayback();
  if(typeof animationTracks!=="undefined")animationTracks={};
  if(typeof saveAnimationTracks==="function")saveAnimationTracks();
  if(typeof renderTimeline==="function")renderTimeline();
  objects.innerHTML="";layers=[];activeLayer=null;overlay.innerHTML="";defs.querySelectorAll("linearGradient").forEach(x=>x.remove());
  ensureLayerStructure();select(null);snapshot();
}
function download(data,name,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function saveSVG(){
  const clone=svg.cloneNode(true);
  clone.querySelector("#overlay")?.remove();
  clone.querySelectorAll(".selected-object").forEach(x=>x.classList.remove("selected-object"));
  const data=new XMLSerializer().serializeToString(clone);
  download(data,"inkescape-art.svg","image/svg+xml");
}
function exportPNG(){
  const clone=svg.cloneNode(true);
  clone.querySelector("#overlay")?.remove();
  const data=new XMLSerializer().serializeToString(clone);
  const url=URL.createObjectURL(new Blob([data],{type:"image/svg+xml"}));
  const img=new Image();
  img.onload=()=>{
    const vb=svg.viewBox.baseVal;
    const c=document.createElement("canvas");
    c.width=vb.width*2;c.height=vb.height*2;
    const ctx=c.getContext("2d");
    ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(blob=>{
      download(blob,"inkescape-art.png","image/png");
      URL.revokeObjectURL(url);
    });
  };
  img.onerror=()=>{alert("PNGに変換できませんでした");URL.revokeObjectURL(url)};
  img.src=url;
}
function openText(p){
  textPosition=p;
  $("textDialog").style.display="flex";
  $("textInput").value="";
  $("textInput").focus();
}
function closeText(){$("textDialog").style.display="none"}
function createText(){
  const value=$("textInput").value;
  if(!value.trim())return;
  const el=make("text",{x:textPosition.x,y:textPosition.y});
  el.textContent=value;
  el.setAttribute("font-size","32");
  el.setAttribute("font-family","sans-serif");
  appendToActiveLayer(el);select(el);snapshot();closeText();
}
/* =====================================
   Inkescape / Canva風アニメーションタイムライン
===================================== */
const TIMELINE_END=250,TIMELINE_SCALE=12;
let timelineFrame=1,timelinePlaying=false,timelineTimer=null,animationTracks={};
const TIMELINE_STORAGE_KEY="inkescape_animation_v2";
function timelineEnd(){return Math.max(2,Math.min(2000,Number($("timelineEnd").value)||250));}
function readTransformMatrix(el){try{const c=el.transform.baseVal.consolidate(),m=c?c.matrix:new DOMMatrix();return [m.a,m.b,m.c,m.d,m.e,m.f];}catch{return [1,0,0,1,0,0];}}
function readAnimatedState(el){return {matrix:readTransformMatrix(el),opacity:Number(el.getAttribute("opacity")??1),fill:el.getAttribute("fill")||"none",stroke:el.getAttribute("stroke")||"none",strokeWidth:Number(el.getAttribute("stroke-width")||1)};}
function saveAnimationTracks(){try{localStorage.setItem(TIMELINE_STORAGE_KEY,JSON.stringify(animationTracks));}catch(e){console.warn("タイムライン保存失敗",e);}}
function addTimelineKeyframe(){
  const targets=getSelectedObjects().filter(el=>el.dataset.layerRoot!=="true"&&el.dataset.folder!=="true");
  if(!targets.length){$("statusText").textContent="キーフレームを追加するオブジェクトを選択してください";return;}
  targets.forEach(el=>{const id=el.dataset.id;if(!animationTracks[id])animationTracks[id]={name:el.dataset.name||el.tagName.toLowerCase(),keys:{}};animationTracks[id].name=el.dataset.name||el.tagName.toLowerCase();animationTracks[id].keys[timelineFrame]=readAnimatedState(el);});
  saveAnimationTracks();renderTimeline();$("statusText").textContent=`フレーム ${timelineFrame} にキーフレームを追加しました`;
}
function deleteTimelineKeyframe(){let removed=false;const targets=getSelectedObjects();
  targets.forEach(el=>{const tr=animationTracks[el.dataset.id];if(tr?.keys?.[timelineFrame]){delete tr.keys[timelineFrame];removed=true;if(!Object.keys(tr.keys).length)delete animationTracks[el.dataset.id];}});
  if(!removed)for(const [id,tr] of Object.entries(animationTracks)){if(tr.keys?.[timelineFrame]){delete tr.keys[timelineFrame];removed=true;if(!Object.keys(tr.keys).length)delete animationTracks[id];}}
  saveAnimationTracks();renderTimeline();
}
function easeTimelineProgress(t){const mode=$("timelineEasing")?.value||"linear";if(mode==="ease-in")return t*t;if(mode==="ease-out")return 1-(1-t)*(1-t);if(mode==="ease-in-out")return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;return t;}
function interpolateColor(a,b,t){
  const parse=v=>{if(!/^#[0-9a-f]{6}$/i.test(v||""))return null;return [1,3,5].map(i=>parseInt(v.slice(i,i+2),16));};
  const A=parse(a),B=parse(b);if(!A||!B)return t<1?a:b;return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function applyTimelineFrame(frame){
  for(const [id,track] of Object.entries(animationTracks)){
    const el=findObjectById(id);if(!el)continue;
    const entries=Object.entries(track.keys||{}).map(([f,v])=>({frame:Number(f),value:v})).sort((a,b)=>a.frame-b.frame);if(!entries.length)continue;
    let before=entries[0],after=entries[entries.length-1];for(const item of entries){if(item.frame<=frame)before=item;if(item.frame>=frame){after=item;break;}}
    const span=after.frame-before.frame,rawT=span?Math.max(0,Math.min(1,(frame-before.frame)/span)):0,t=easeTimelineProgress(rawT),A=before.value,B=after.value;
    if(A.matrix&&B.matrix){const m=A.matrix.map((v,i)=>v+((B.matrix?.[i]??v)-v)*t);el.setAttribute("transform",`matrix(${m.join(" ")})`);}
    el.setAttribute("opacity",String((A.opacity??1)+((B.opacity??A.opacity??1)-(A.opacity??1))*t));
    if(A.fill!==undefined||B.fill!==undefined)el.setAttribute("fill",interpolateColor(A.fill||"none",B.fill||A.fill||"none",t));
    if(A.stroke!==undefined||B.stroke!==undefined)el.setAttribute("stroke",interpolateColor(A.stroke||"none",B.stroke||A.stroke||"none",t));
    if(A.strokeWidth!==undefined||B.strokeWidth!==undefined)el.setAttribute("stroke-width",String((A.strokeWidth??1)+((B.strokeWidth??A.strokeWidth??1)-(A.strokeWidth??1))*t));
  }
}
function goToFrame(frame){
  timelineFrame=Math.max(1,Math.min(timelineEnd(),Math.round(Number(frame)||1)));applyTimelineFrame(timelineFrame);
  const x=180+(timelineFrame-1)*TIMELINE_SCALE;const playhead=$("timelinePlayhead");if(playhead)playhead.style.left=x+"px";
  $("timelineFrameLabel").textContent=`フレーム ${timelineFrame} / ${timelineEnd()}`;
  if(editorMode==="EDIT"&&selected?.tagName.toLowerCase()==="path")drawNodes(selected);
}
function duplicateTimelineFrame(){
  const next=Math.min(timelineEnd(),timelineFrame+1);if(next===timelineFrame)return;
  getSelectedObjects().forEach(el=>{const tr=animationTracks[el.dataset.id];if(tr?.keys?.[timelineFrame])tr.keys[next]=JSON.parse(JSON.stringify(tr.keys[timelineFrame]));});
  saveAnimationTracks();goToFrame(next);renderTimeline();
}
function toggleTimelinePlayback(){if(timelinePlaying){stopTimelinePlayback();return;}timelinePlaying=true;$("playTimelineBtn").textContent="Ⅱ";$("playTimelineBtn").title="停止";const fps=Math.max(1,Math.min(60,Number($("timelineFPS").value)||24));timelineTimer=setInterval(()=>{if(timelineFrame>=timelineEnd())goToFrame(1);else goToFrame(timelineFrame+1);},1000/fps);}
function stopTimelinePlayback(){timelinePlaying=false;clearInterval(timelineTimer);timelineTimer=null;$("playTimelineBtn").textContent="▶";$("playTimelineBtn").title="再生";}
function moveTimelineKey(id,oldFrame,newFrame){const tr=animationTracks[id];if(!tr?.keys?.[oldFrame])return;newFrame=Math.max(1,Math.min(timelineEnd(),Math.round(newFrame)));if(newFrame!==Number(oldFrame)&&tr.keys[newFrame])return;tr.keys[newFrame]=tr.keys[oldFrame];delete tr.keys[oldFrame];saveAnimationTracks();renderTimeline();goToFrame(newFrame);}
function renderTimeline(){
  const end=timelineEnd(),ruler=$("timelineRuler"),rows=$("timelineRows"),content=$("timelineContent");content.style.width=(180+end*TIMELINE_SCALE+25)+"px";ruler.replaceChildren();rows.replaceChildren();
  for(let f=1;f<=end;f+=5){const tick=document.createElement("span");tick.className="timeline-tick";tick.style.left=(180+(f-1)*TIMELINE_SCALE)+"px";tick.textContent=f;ruler.append(tick);}
  ruler.onclick=e=>{const rect=content.getBoundingClientRect();goToFrame(Math.round((e.clientX-rect.left-180)/TIMELINE_SCALE)+1);};
  const tracks=Object.entries(animationTracks).filter(([id])=>findObjectById(id));
  if(!tracks.length){const empty=document.createElement("div");empty.className="timeline-empty";empty.textContent="オブジェクトを選択 → キー追加。タイムライン上の◆をドラッグしてタイミングを調整できます。";rows.append(empty);}
  tracks.forEach(([id,track],index)=>{
    const row=document.createElement("div");row.className="timeline-row";row.dataset.trackId=id;
    const label=document.createElement("span");label.className="timeline-row-label";label.textContent="▸  "+(track.name||id);row.append(label);
    const frames=Object.keys(track.keys||{}).map(Number).sort((a,b)=>a-b);
    if(frames.length>1){const clip=document.createElement("div");clip.className="timeline-clip";clip.style.left=(180+(frames[0]-1)*TIMELINE_SCALE)+"px";clip.style.width=Math.max(18,(frames.at(-1)-frames[0])*TIMELINE_SCALE)+"px";row.append(clip);}
    frames.forEach(frame=>{
      const key=document.createElement("button");key.type="button";key.className="timeline-key";key.style.left=(180+(frame-1)*TIMELINE_SCALE+5)+"px";key.title=`${track.name||id} / ${frame}フレーム（ドラッグで移動）`;
      key.addEventListener("click",e=>{e.stopPropagation();select(findObjectById(id));goToFrame(frame);});
      key.addEventListener("pointerdown",e=>{
        e.preventDefault();e.stopPropagation();key.classList.add("dragging");const startX=e.clientX;let moved=false;
        const move=ev=>{if(Math.abs(ev.clientX-startX)>3)moved=true;if(moved){const rect=content.getBoundingClientRect();const f=Math.max(1,Math.min(end,Math.round((ev.clientX-rect.left-180)/TIMELINE_SCALE)+1));key.style.left=(180+(f-1)*TIMELINE_SCALE+5)+"px";}};
        const up=ev=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);key.classList.remove("dragging");if(moved){const rect=content.getBoundingClientRect();const f=Math.max(1,Math.min(end,Math.round((ev.clientX-rect.left-180)/TIMELINE_SCALE)+1));moveTimelineKey(id,frame,f);}else{select(findObjectById(id));goToFrame(frame);}};
        window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true});
      });row.append(key);
    });
    row.addEventListener("pointerdown",e=>{if(e.target.classList.contains("timeline-key"))return;const rect=content.getBoundingClientRect();goToFrame(Math.round((e.clientX-rect.left-180)/TIMELINE_SCALE)+1);});rows.append(row);
  });
  goToFrame(timelineFrame);
}
function exportAnimatedSVG(){
  const clone=svg.cloneNode(true),fps=Math.max(1,Math.min(60,Number($("timelineFPS").value)||24)),duration=timelineEnd()/fps;
  for(const [id,track] of Object.entries(animationTracks)){
    const el=clone.querySelector(`[data-id="${CSS.escape(id)}"]`);if(!el)continue;
    const entries=Object.entries(track.keys||{}).map(([f,v])=>({frame:Number(f),value:v})).sort((a,b)=>a.frame-b.frame);if(entries.length<2)continue;
    const addAnim=(attr,values,type)=>{
      if(values.some(v=>v==null))return;
      const a=document.createElementNS(svg.namespaceURI,"animate");a.setAttribute("attributeName",attr);if(type)a.setAttribute("type",type);
      a.setAttribute("values",values.join(";"));a.setAttribute("keyTimes",values.map((_,i)=>((entries[i]?.frame??(i===0?1:timelineEnd()))-1)/Math.max(1,timelineEnd()-1)).map(v=>Math.max(0,Math.min(1,v)).toFixed(4)).join(";"));
      a.setAttribute("dur",duration+"s");a.setAttribute("repeatCount","indefinite");a.setAttribute("calcMode","linear");el.append(a);
    };
    const props=[
      ["transform",entries.map(x=>`matrix(${(x.value.matrix||[1,0,0,1,0,0]).join(" ")})`)],
      ["opacity",entries.map(x=>String(x.value.opacity??1))],
      ["fill",entries.map(x=>x.value.fill||"none")],
      ["stroke",entries.map(x=>x.value.stroke||"none")],
      ["stroke-width",entries.map(x=>String(x.value.strokeWidth??1))]
    ];
    props.forEach(([attr,values])=>{
      // SMILのkeyTimesは0から1である必要があるため、端点を補完
      const frames=entries.map(x=>x.frame),vals=[...values],times=frames.map(f=>(f-1)/Math.max(1,timelineEnd()-1));
      if(times[0]>0){vals.unshift(vals[0]);times.unshift(0);}if(times.at(-1)<1){vals.push(vals.at(-1));times.push(1);}
      const a=document.createElementNS(svg.namespaceURI,"animate");a.setAttribute("attributeName",attr);a.setAttribute("values",vals.join(";"));a.setAttribute("keyTimes",times.map(v=>v.toFixed(4)).join(";"));a.setAttribute("dur",duration+"s");a.setAttribute("repeatCount","indefinite");a.setAttribute("calcMode","linear");el.append(a);
    });
  }
  const data=new XMLSerializer().serializeToString(clone),blob=new Blob([data],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="inkescape-animation.svg";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$("statusText").textContent="アニメーションSVGを書き出しました";
}
$("timelineEnd").addEventListener("change",()=>{if(timelineFrame>timelineEnd())goToFrame(timelineEnd());renderTimeline();});
$("timelineFPS").addEventListener("change",()=>{if(timelinePlaying){stopTimelinePlayback();toggleTimelinePlayback();}});
$("timelineEasing").addEventListener("change",()=>goToFrame(timelineFrame));
try{animationTracks=JSON.parse(localStorage.getItem(TIMELINE_STORAGE_KEY)||localStorage.getItem("inkescape_animation_v1")||"{}");}catch{animationTracks={};}
renderTimeline();

$("importFile").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const data=await file.text();
    const doc=new DOMParser().parseFromString(data,"image/svg+xml");
    if(doc.documentElement.tagName.toLowerCase()!=="svg")throw Error("SVG形式ではありません");
    const incoming=doc.documentElement;
    objects.innerHTML="";
    activeLayer=null;
    ensureLayerStructure();
    defs.innerHTML=incoming.querySelector("defs")?.innerHTML||"";
    const group=incoming.querySelector("g")||incoming;
    [...group.children].forEach(el=>{
      if(el.tagName.toLowerCase()!=="defs")appendToActiveLayer(document.importNode(el,true));
    });
    if(incoming.getAttribute("viewBox"))svg.setAttribute("viewBox",incoming.getAttribute("viewBox"));
    select(null);snapshot();updateLayers();
  }catch(err){alert("読み込みエラー: "+err.message)}
  e.target.value="";
});
window.addEventListener("keydown",e=>{
  if(e.key==="Tab"&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.matches("input,textarea,select,[contenteditable=true]")){
    e.preventDefault();setMode(editorMode==="OBJECT"?"EDIT":"OBJECT");return;
  }
  if(e.target.matches("input,textarea,select,[contenteditable=true]"))return;
  if(e.ctrlKey||e.metaKey){
    if(e.key.toLowerCase()==="a"&&editorMode==="OBJECT"){
      e.preventDefault();
      const roots=[...objects.children].filter(el=>el.dataset.layerRoot==="true");
      const candidates=roots.length?roots.flatMap(root=>[...root.children]):[...objects.children];
      selectedObjects=new Set(candidates.filter(el=>el.dataset.id&&el.dataset.guide!=="true"));
      selected=[...selectedObjects].at(-1)||null;
      refreshSelectionVisuals();updateLayers();updateProperties();
      return;
    }
    if(e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
    if(e.key.toLowerCase()==="y"){e.preventDefault();redo()}
    if(e.key.toLowerCase()==="s"){e.preventDefault();saveSVG()}
    if(e.key.toLowerCase()==="d"){e.preventDefault();duplicateSelected()}
    return;
  }
  const keys={v:"select",n:"node",l:"line",p:"freehand",b:"bezier",r:"rect",e:"ellipse",t:"text"};
  if(keys[e.key.toLowerCase()])setTool(keys[e.key.toLowerCase()]);
  if(e.key==="Delete"||e.key==="Backspace")deleteSelected();
  if(e.key==="Escape")cancelPath();
});
const restored = loadDrawing();
ensureLayerStructure();
updateLayers();
setMode("OBJECT");
snapshot();
