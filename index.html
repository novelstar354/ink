
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkescape</title>
<link rel="icon" href="inkescape.png" sizes="16x16" type="image/png" />   
<style>
:root {
  --tool-width:48px;--right-width:310px;--outliner-height:280px;--timeline-height:112px;--splitter-size:5px;
  --bg:#202124;--panel:#292a2d;--panel2:#34363a;
  --line:#45474c;--text:#e8eaed;--muted:#aeb3bb;
  --blue:#4c9ffe;--accent:#287edb;
}
html{user-select: none;
  -webkit-user-select: none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:13px Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{background:var(--panel2);color:var(--text);
border:1px solid var(--line);border-radius:4px;padding:7px;cursor:pointer}
button:hover{background:#45484e}
button.active{background:#175ea8;border-color:var(--blue)}
.topbar{height:44px;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:5px;padding:4px 8px;overflow-x:auto}
.brand{font-weight:bold;font-size:16px;margin-right:12px;white-space:nowrap}
.workspace{display:grid;grid-template-columns:48px 1fr 265px;height:calc(100vh - 44px)}
.toolbar{background:var(--panel);border-right:1px solid var(--line);
display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:5px}
.tool{width:37px;height:37px;padding:0;font-size:17px;flex-shrink:0}
.tool-separator{height:1px;background:var(--line);width:30px;margin:3px}
.center{position:relative;overflow:hidden;background:#1b1c1e}
.canvas-area{position:absolute;inset:0;overflow:auto;
background-image:radial-gradient(#444 0.7px,transparent .7px);background-size:15px 15px}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:900px;height:650px;background:white;box-shadow:0 5px 30px #0009}
#svg{width:100%;height:100%;display:block;touch-action:none}
.sidebar{background:var(--panel);border-left:1px solid var(--line);
overflow:auto;padding:11px}
.panel-title{font-weight:bold;font-size:14px;margin:5px 0 12px}
.section{border-top:1px solid var(--line);padding:11px 0}
.section h3{font-size:12px;color:var(--muted);margin:0 0 9px}
.field{display:flex;align-items:center;gap:7px;margin:7px 0}
.field label{width:65px;color:var(--muted);flex-shrink:0}
.field input[type=color]{width:43px;height:27px;padding:1px}
.field input[type=number],.field input[type=text],.field select{
min-width:0;flex:1;width:100%;background:#202124;color:white;
border:1px solid var(--line);border-radius:3px;padding:5px}
.field input[type=range]{flex:1;min-width:0}
.field span{min-width:35px;text-align:right;color:var(--muted)}
.full{width:100%}
.row-buttons{display:flex;gap:5px}
.row-buttons button{flex:1}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:5px;padding:6px;
background:#202124;border:1px solid var(--line);border-radius:3px}
.layer.selected{border-color:var(--blue)}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.layer button{padding:3px 6px}
.status{position:absolute;bottom:0;left:0;right:0;height:26px;
background:var(--panel);border-top:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
padding:0 10px;color:var(--muted);z-index:5}
#zoom{width:65px;background:#202124;color:white;border:1px solid var(--line)}
#textDialog{position:fixed;inset:0;background:#0009;display:none;
align-items:center;justify-content:center;z-index:20}
.dialog{background:var(--panel);padding:20px;border:1px solid var(--line);
border-radius:8px;width:min(350px,90vw)}
.dialog input{width:100%;padding:9px;margin:10px 0;background:#202124;
border:1px solid var(--line);color:white}
.dialog-actions{display:flex;justify-content:flex-end;gap:7px}
#selectionBox{fill:none;stroke:#1688ff;stroke-width:1.5;
stroke-dasharray:5 3;pointer-events:none}
.node-handle{fill:white;stroke:#1688ff;stroke-width:2}
.node-handle.active{fill:#1688ff}
/* Blender風ワークスペース */
.workspace{height:calc(100vh - 44px - var(--timeline-height) - var(--splitter-size));grid-template-columns:var(--tool-width) var(--splitter-size) minmax(0,1fr) var(--splitter-size) var(--right-width);}
.sidebar{padding:0;display:grid;grid-template-rows:minmax(110px,var(--outliner-height)) var(--splitter-size) minmax(110px,1fr);overflow:hidden;gap:0;background:#252629;}
.outliner-panel{min-height:0;overflow:auto;border-bottom:1px solid #111;background:#292a2d;padding:9px;}
.outliner-heading,.properties-heading{height:27px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;color:#d8dbe0;margin-bottom:7px;}
.properties-panel{min-height:0;overflow:auto;padding:10px;background:#292a2d;}
.properties-panel .panel-title{display:none;}
.properties-panel .section:first-of-type{border-top:0;padding-top:3px;}
.timeline{height:var(--timeline-height);background:#252629;border-top:1px solid #111;display:flex;flex-direction:column;color:#c5c8ce;}
.timeline-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #414247;}
.timeline-track{position:relative;flex:1;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0,transparent 49px,#3b3d42 50px);}
.timeline-ruler{height:25px;border-bottom:1px solid #3b3d42;display:flex;justify-content:space-around;color:#8e949e;font-size:11px;padding-top:5px;}
.timeline-playhead{position:absolute;left:28%;top:0;bottom:0;width:1px;background:#e6a23c;}
.timeline-playhead:before{content:"";position:absolute;top:0;left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid #e6a23c;}
#objectMenu{position:fixed;z-index:1000;display:none;min-width:150px;padding:5px;background:#303238;border:1px solid #555963;border-radius:6px;box-shadow:0 8px 24px #0009;}
#objectMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:4px;}
#objectMenu button:hover{background:#454a54;}
.mode-switch{display:flex;align-items:center;gap:4px;margin-left:8px;padding-left:9px;border-left:1px solid var(--line);white-space:nowrap;}
.mode-switch button{min-width:94px;}
.mode-switch button.active{background:#245b8e;border-color:#579bd7;}
.palette-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px;}
.palette-color{height:27px;min-width:0;padding:0;border:1px solid #737780;border-radius:4px;position:relative;}
.palette-color:hover{outline:2px solid var(--blue);outline-offset:1px;}
.palette-color.active{outline:2px solid #fff;outline-offset:1px;}
.palette-hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
.layer.multi-selected{border-color:#78b7f5;background:#203b54;}
#objects .selected-object{filter:drop-shadow(0 0 2px #1688ff); }
.mode-badge{font-size:11px;color:#aeb3bb;margin-left:5px;}
.layer{min-height:31px;}
.layer-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;}
.layer-name-input{flex:1;min-width:0;width:0;background:#17181a;color:#fff;border:1px solid var(--blue);border-radius:3px;padding:4px;}
.layer-menu{width:25px;min-width:25px;padding:2px!important;font-size:17px;line-height:18px;}
@media(max-width:800px){
.workspace{grid-template-columns:42px var(--splitter-size) minmax(0,1fr) var(--splitter-size) 260px;height:calc(100vh - 44px - var(--timeline-height) - var(--splitter-size));}
.sidebar{display:grid;grid-template-rows:minmax(100px,var(--outliner-height)) var(--splitter-size) minmax(100px,1fr);}
.timeline{height:90px;}
.brand{font-size:13px;margin-right:3px}
.topbar{gap:2px}
}
@media(max-width:560px){.workspace{grid-template-columns:40px 0 minmax(0,1fr) 0 0;} .sidebar,.dock-splitter.vertical,.dock-splitter.horizontal:not(.timeline-splitter){display:none!important;} .timeline{height:var(--timeline-height);}}

/* フォルダ・階層表示 */

.layer.folder {
  border-color: #687b96;
  background: #252b35;
}

.layer.dragging {
  opacity: .4;
}

.layer.drop-target {
  outline: 2px solid var(--blue);
  background: #24476b;
}

.layer-children {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-left: 15px;
  padding-left: 8px;
  border-left: 1px solid var(--line);
}

.folder-toggle {
  min-width: 25px;
  width: 25px;
  padding: 3px !important;
  font-size: 12px;
}

.layer-name {
  min-width: 0;
}

/* リサイズ可能なドック */
.dock-splitter{background:#1b1c1e;position:relative;z-index:8;touch-action:none;user-select:none;}
.dock-splitter:hover,.dock-splitter.dragging{background:#397fbd;}
.dock-splitter.vertical{cursor:col-resize;border-left:1px solid #111;border-right:1px solid #111;}
.dock-splitter.horizontal{cursor:row-resize;border-top:1px solid #111;border-bottom:1px solid #111;}
.timeline-splitter{height:var(--splitter-size);width:100%;flex:none;}
.layout-control{display:flex;align-items:center;gap:5px;margin-left:auto;white-space:nowrap;}
.layout-control select{background:#202124;color:#eee;border:1px solid var(--line);border-radius:4px;padding:6px;max-width:150px;}
.layer.layer-root{background:#302f29;border-color:#76653b;}
.layer.active-layer .layer-name{color:#f2d38a;font-weight:700;}
.layer-root-mark{font-size:10px;color:#d7b56d;margin-left:4px;}
@media(max-width:800px){.layout-control{margin-left:4px}.layout-control select{max-width:105px}.layout-control span{display:none;}}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">✦ Inkescape</div>
  <div class="layout-control"><span>レイアウト</span><select id="layoutPreset"><option value="standard">標準</option><option value="canvas">キャンバス重視</option><option value="properties">プロパティ重視</option><option value="outliner">アウトライナー重視</option></select><button onclick="applyLayoutPreset()">適用</button></div>
  <div class="mode-switch" aria-label="編集モード">
    <button id="objectModeBtn" class="active" onclick="setMode('OBJECT')">オブジェクト</button>
    <button id="editModeBtn" onclick="setMode('EDIT')">編集モード</button>
    <span id="modeBadge" class="mode-badge">Object Mode</span>
  </div>
  <button onclick="newDocument()">新規</button>
  <button onclick="$('importFile').click()">開く</button>
    <button onclick="$('imageFile').click()">🖼 画像追加</button>
<input
  id="imageFile"
  type="file"
  accept="image/png,image/jpeg,image/webp,image/gif"
  hidden
>
  <button onclick="saveSVG()">SVG保存</button>
  <button onclick="exportPNG()">PNG</button>
  <button onclick="undo()">↶</button>
  <button onclick="redo()">↷</button>
  <button onclick="duplicateSelected()">複製</button>
  <button onclick="deleteSelected()">削除</button>
<button id="clearCanvas" class="danger">🗑 クリア</button>
  <input id="importFile" type="file" accept=".svg,image/svg+xml" hidden>
</header>

<div class="workspace">
<aside class="toolbar">
  <button class="tool active" data-tool="select" title="選択 V">↖</button>
  <button class="tool" data-tool="node" title="ノード N">◇</button>
  <div class="tool-separator"></div>
  <button class="tool" data-tool="line" title="直線 L">╱</button>
  <button class="tool" data-tool="polyline" title="折れ線">⌁</button>
  <button class="tool" data-tool="freehand" title="フリーハンド P">✎</button>
  <button class="tool" data-tool="bezier" title="ベジェ B">⌒</button>
  <div class="tool-separator"></div>
  <button class="tool" data-tool="rect" title="四角形 R">▭</button>
  <button class="tool" data-tool="ellipse" title="楕円 E">◯</button>
  <button class="tool" data-tool="star" title="星形">☆</button>
  <button class="tool" data-tool="text" title="テキスト T">T</button>
  <div class="tool-separator"></div>
  <button class="tool" data-tool="hand" title="キャンバス移動">✋</button>
</aside>
<div class="dock-splitter vertical" data-resize="left" title="ツールバー幅を変更"></div>

<main class="center">
  <div class="canvas-area" id="canvasArea">
    <div id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
        <defs id="defs">
          <marker id="arrowEnd" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/>
          </marker>
          <marker id="arrowStart" markerWidth="8" markerHeight="8"
            refX="1" refY="4" orient="auto">
            <path d="M8 0 L0 4 L8 8 Z" fill="context-stroke"/>
          </marker>
        </defs>
        <g id="objects"></g>
        <g id="overlay"></g>
      </svg>
    </div>
  </div>
  <div class="status">
    <span id="statusText">選択ツール</span>
    <span>
      <button onclick="changeZoom(-.1)">−</button>
      <input id="zoom" value="100%" readonly>
      <button onclick="changeZoom(.1)">＋</button>
    </span>
  </div>
</main>
<div class="dock-splitter vertical" data-resize="right" title="右パネル幅を変更"></div>

<aside class="sidebar" id="sidebar">
  <div class="panel-title">オブジェクト設定</div>
    <div class="section">
  <h3>オブジェクト名</h3>
  <div class="field">
    <label>名前</label>
    <input type="text" id="objectName" placeholder="オブジェクト名">
  </div>
</div>
  <div class="section">
    <h3>カラーパレット</h3>
    <div class="palette-grid" id="paletteGrid">
      <button class="palette-color" style="background:#ffffff" data-color="#ffffff" title="ホワイト"></button>
      <button class="palette-color" style="background:#d9dde3" data-color="#d9dde3" title="ライトグレー"></button>
      <button class="palette-color" style="background:#858b96" data-color="#858b96" title="グレー"></button>
      <button class="palette-color" style="background:#292d34" data-color="#292d34" title="チャコール"></button>
      <button class="palette-color" style="background:#111827" data-color="#111827" title="ネイビー"></button>
      <button class="palette-color" style="background:#000000" data-color="#000000" title="ブラック"></button>
      <button class="palette-color" style="background:#e85d5d" data-color="#e85d5d" title="レッド"></button>
      <button class="palette-color" style="background:#ed9850" data-color="#ed9850" title="オレンジ"></button>
      <button class="palette-color" style="background:#e8c85a" data-color="#e8c85a" title="イエロー"></button>
      <button class="palette-color" style="background:#65ad78" data-color="#65ad78" title="グリーン"></button>
      <button class="palette-color" style="background:#4c9ffe" data-color="#4c9ffe" title="ブルー"></button>
      <button class="palette-color" style="background:#9b78d1" data-color="#9b78d1" title="パープル"></button>
      <button class="palette-color" style="background:#e88eb5" data-color="#e88eb5" title="ピンク"></button>
      <button class="palette-color" style="background:#8cc7c1" data-color="#8cc7c1" title="ミント"></button>
      <button class="palette-color" style="background:#a6b86b" data-color="#a6b86b" title="オリーブ"></button>
      <button class="palette-color" style="background:#b88768" data-color="#b88768" title="ブラウン"></button>
    </div>
    <div class="palette-hint">クリックすると選択中のオブジェクトの塗り色に適用されます。</div>
  </div>
  <div class="section">
    <h3>塗り</h3>
    <div class="field"><label>色</label><input type="color" id="fill" value="#4c9ffe"><button onclick="setFill('none')">なし</button></div>
    <div class="field"><label>透明度</label><input type="range" id="opacity" min="0" max="100" value="100"><span id="opacityValue">100%</span></div>
  </div>
  <div class="section">
    <h3>線</h3>
    <div class="field"><label>色</label><input type="color" id="stroke" value="#202124"><button onclick="setStroke('none')">なし</button></div>
    <div class="field"><label>太さ</label><input type="number" id="strokeWidth" min="0" max="100" value="3"></div>
    <div class="field"><label>端</label><select id="linecap"><option value="butt">平ら</option><option value="round">丸</option><option value="square">四角</option></select></div>
    <div class="field"><label>接合</label><select id="linejoin"><option value="miter">角</option><option value="round">丸</option><option value="bevel">斜め</option></select></div>
    <div class="field"><label>線種</label><select id="dash"><option value="">実線</option><option value="10 5">破線</option><option value="2 5">点線</option><option value="15 5 3 5">一点鎖線</option></select></div>
    <div class="field"><label>始点</label><select id="arrowStart"><option value="">なし</option><option value="url(#arrowStart)">矢印</option></select></div>
    <div class="field"><label>終点</label><select id="arrowEnd"><option value="">なし</option><option value="url(#arrowEnd)">矢印</option></select></div>
  </div>
  <div class="section">
    <h3>グラデーション</h3>
    <div class="field"><label>開始色</label><input type="color" id="gradA" value="#4c9ffe"></div>
    <div class="field"><label>終了色</label><input type="color" id="gradB" value="#a855f7"></div>
    <button class="full" onclick="applyGradient()">グラデーション適用</button>
  </div>
  <div class="section">
    <h3>位置・サイズ</h3>
    <div class="field"><label>X</label><input type="number" id="posX"></div>
    <div class="field"><label>Y</label><input type="number" id="posY"></div>
    <div class="field"><label>幅</label><input type="number" id="objW"></div>
    <div class="field"><label>高さ</label><input type="number" id="objH"></div>
    <button class="full" onclick="applyGeometry()">適用</button>
  </div>
  <div class="section">
    <h3>オブジェクト操作</h3>
    <div class="row-buttons">
      <button onclick="groupSelected()">グループ化</button>
      <button onclick="ungroupSelected()">解除</button>
    </div>
    <div class="row-buttons" style="margin-top:6px">
      <button onclick="moveOrder(-1)">背面へ</button>
      <button onclick="moveOrder(1)">前面へ</button>
    </div>
    <div class="row-buttons" style="margin-top:6px">
      <button onclick="alignSelected('left')">左揃え</button>
      <button onclick="alignSelected('center')">中央揃え</button>
      <button onclick="alignSelected('right')">右揃え</button>
    </div>
    <div class="row-buttons" style="margin-top:6px">
      <button onclick="alignSelected('top')">上揃え</button>
      <button onclick="alignSelected('middle')">上下中央</button>
      <button onclick="alignSelected('bottom')">下揃え</button>
    </div>
  </div>
  <div class="section">
  <h3>オブジェクト・フォルダ</h3>

  <div class="row-buttons">
    <button onclick="addFolder()">📁 フォルダ作成</button>
    <button onclick="addLayer()">＋ レイヤー追加</button>
  </div>

  <div id="layers" class="layers" style="margin-top:8px"></div>
</div>
  <div class="section">
    <h3>ページ</h3>
    <div class="field"><label>幅</label><input id="pageW" type="number" value="900"></div>
    <div class="field"><label>高さ</label><input id="pageH" type="number" value="650"></div>
    <button class="full" onclick="resizePage()">ページサイズ変更</button>
  </div>
</aside>
</div>

<div class="dock-splitter horizontal timeline-splitter" data-resize="timeline" title="タイムラインの高さを変更"></div>
<section class="timeline" id="timeline" aria-label="タイムライン">
  <div class="timeline-head"><strong>タイムライン</strong><button type="button" title="先頭フレーム">|◀</button><button type="button" title="再生" disabled>▶</button><button type="button" title="末尾フレーム">▶|</button><span style="margin-left:auto;color:#969ba4">フレーム 1 / 250</span></div>
  <div class="timeline-track"><div class="timeline-ruler"><span>1</span><span>25</span><span>50</span><span>75</span><span>100</span><span>125</span><span>150</span><span>175</span><span>200</span><span>225</span><span>250</span></div><div class="timeline-playhead"></div></div>
</section>
<div id="objectMenu" role="menu">
  <button type="button" data-action="rename">名前を変更</button>
  <button type="button" data-action="duplicate">複製</button>
  <button type="button" data-action="delete">削除</button>
</div>

<div id="textDialog">
  <div class="dialog">
    <b>テキストを入力</b>
    <input id="textInput" placeholder="テキスト">
    <div class="dialog-actions">
      <button onclick="closeText()">キャンセル</button>
      <button onclick="createText()">追加</button>
    </div>
  </div>
</div>
<script>

"use strict";

const $=id=>document.getElementById(id);
const svg=$("svg"),objects=$("objects"),defs=$("defs"),overlay=$("overlay");

let tool="select",selected=null,drawing=false,preview=null;
let editorMode="OBJECT";
let selectedObjects=new Set();
let start=null,points=[],drag=null,nodeDrag=null;
let zoom=1,history=[],historyIndex=-1,objectCounter=0;
let textPosition=null;
let activeLayer=null;
let layers=[];
$("objectName").addEventListener("change", () => {
  if (!selected) return;

  const name = $("objectName").value.trim();

  if (!name) {
    $("objectName").value =
      selected.dataset.name || selected.tagName;
    return;
  }

  selected.dataset.name = name;

  updateLayers();
  snapshot();
});
/* =====================================
   Inkescape 自動保存・復元
===================================== */

const INKESCAPE_STORAGE_KEY = "inkescape_drawing_v1";

function saveDrawing() {
  try {
    const data = {
      version: 1,
      objects: objects.innerHTML,
      defs: defs.innerHTML,
      layers,
      activeLayer,
      objectCounter,
      viewBox: svg.getAttribute("viewBox"),

function loadDrawing() {
  try {
    const saved = localStorage.getItem(INKESCAPE_STORAGE_KEY);
    if (!saved) return false;

    const data = JSON.parse(saved);
    if (data.version !== 1) return false;

    objects.innerHTML = data.objects || "";
    defs.innerHTML = data.defs || "";

    layers = data.layers || [];
    activeLayer = data.activeLayer || null;
    objectCounter = data.objectCounter || 0;

    if (data.viewBox) {
      svg.setAttribute("viewBox", data.viewBox);
    }

    if (data.pageWidth) {
      $("stage").style.width = data.pageWidth;
      $("pageW").value = parseInt(data.pageWidth) || 900;
    }

    if (data.pageHeight) {
      $("stage").style.height = data.pageHeight;
      $("pageH").value = parseInt(data.pageHeight) || 650;
    }

    selected = null;
    overlay.innerHTML = "";

    updateLayers();

function snapshot(){
  const state=JSON.stringify({
    objects:objects.innerHTML,
    defs:defs.innerHTML,
    layers:layers,
    activeLayer:activeLayer
  });
  if(history[historyIndex]===state)return;
  history=history.slice(0,historyIndex+1);
  history.push(state);
  if(history.length>60)history.shift();
  historyIndex=history.length-1;
  saveDrawing();
}
function restore(state) {
  const s = JSON.parse(state);

  objects.innerHTML = s.objects;
  defs.innerHTML = s.defs;

  layers = s.layers || [];
  activeLayer = s.activeLayer || null;

  selected = null;
  selectedObjects.clear();
  refreshSelectionVisuals();

  updateLayers();
  updateProperties();

  saveDrawing();
}
function undo(){if(historyIndex>0)restore(history[--historyIndex])}
function redo(){if(historyIndex<history.length-1)restore(history[++historyIndex])}

    rect:"四角形",ellipse:"楕円",star:"星形",text:"テキスト",hand:"キャンバス移動"

function point(e){
  const p=svg.createSVGPoint();
  p.x=e.clientX;p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function createLayerGroup(name){
  const group=document.createElementNS(svg.namespaceURI,"g");
  const id="layer-"+(++objectCounter);
  group.dataset.id=id;group.dataset.name=name;group.dataset.folder="true";
  group.dataset.layerRoot="true";group.dataset.collapsed="false";group.dataset.layer=id;
  return group;
}
function getActiveLayerGroup(){
  let group=[...objects.children].find(el=>el.dataset.layerRoot==="true"&&el.dataset.id===activeLayer);
  if(!group)group=[...objects.children].find(el=>el.dataset.layerRoot==="true");
  if(!group){group=createLayerGroup("レイヤー 1");objects.append(group);activeLayer=group.dataset.id;}
  return group;
}
function appendToActiveLayer(el){const group=getActiveLayerGroup();group.append(el);el.dataset.layer=group.dataset.id;return el;}
function ensureLayerStructure(){
  let roots=[...objects.children].filter(el=>el.dataset.layerRoot==="true");
  if(!roots.length){
    const old=[...objects.children];const group=createLayerGroup("レイヤー 1");
    objects.append(group);old.forEach(el=>group.append(el));roots=[group];activeLayer=group.dataset.id;
  }else if(!roots.some(el=>el.dataset.id===activeLayer)){activeLayer=roots[0].dataset.id;}
  roots.forEach((root,i)=>{root.dataset.folder="true";root.dataset.layerRoot="true";if(!root.dataset.name)root.dataset.name="レイヤー "+(i+1);});
}

function make(tag,attrs={}){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  el.dataset.id="object-"+(++objectCounter);
  el.dataset.name=tag+" "+objectCounter;
  el.dataset.layer=activeLayer||"default";
  el.setAttribute("fill",tag==="path"?"none":$("fill").value);
  el.setAttribute("stroke",$("stroke").value);
  el.setAttribute("stroke-width",$("strokeWidth").value);
  el.setAttribute("stroke-linecap",$("linecap").value);
  el.setAttribute("stroke-linejoin",$("linejoin").value);
  el.setAttribute("opacity",Number($("opacity").value)/100);
  if($("dash").value)el.setAttribute("stroke-dasharray",$("dash").value);
  if($("arrowStart").value)el.setAttribute("marker-start",$("arrowStart").value);
  if($("arrowEnd").value)el.setAttribute("marker-end",$("arrowEnd").value);
  return el;
}

$("imageFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];

  if (!file) return;

  // 対応形式チェック
  const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "image/gif"
  ];

  if (!allowedTypes.includes(file.type)) {
    alert("PNG・JPEG・WebP・GIF形式の画像を選択してください。");
    e.target.value = "";
    return;
  }

  // LocalStorageの容量を考慮
  if (file.size > 1.5 * 1024 * 1024) {
    alert("画像サイズは1.5MB以下にしてください。");
    e.target.value = "";
    return;
  }

  try {
    const dataURL = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("画像を読み込めませんでした"));

      reader.readAsDataURL(file);
    });

    const image = new Image();

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("画像を開けませんでした"));
      image.src = dataURL;
    });

    // キャンバスに収まる大きさに調整
    const maxWidth = 500;
    const maxHeight = 400;

    const scale = Math.min(
      1,
      maxWidth / image.naturalWidth,
      maxHeight / image.naturalHeight
    );

    const width = image.naturalWidth * scale;
    const height = image.naturalHeight * scale;

    const viewBox = svg.viewBox.baseVal;

    const x = (viewBox.width - width) / 2;
    const y = (viewBox.height - height) / 2;

    // SVG画像オブジェクトを作成
    const el = make("image", {
      x,
      y,
      width,
      height
    });

    el.setAttribute("href", dataURL);
    el.setAttributeNS(
      "http://www.w3.org/1999/xlink",
      "xlink:href",
      dataURL
    );

    el.setAttribute("preserveAspectRatio", "xMidYMid meet");

    // オブジェクト名
    el.dataset.name = file.name;

    appendToActiveLayer(el);

    select(el);
    snapshot();

    $("statusText").textContent = "画像を追加しました";

  } catch (error) {
    console.error(error);
    alert("画像の追加に失敗しました。");
  }

  e.target.value = "";
});
function refreshSelectionVisuals(){

    el.classList.toggle("selected-object",selectedObjects.has(el));
  });
}
function select(el){
  selectedObjects.clear();
  selected=el||null;
  if(selected){
    selectedObjects.add(selected);
    const owner=selected.closest('[data-layer-root="true"]');
    if(owner)activeLayer=owner.dataset.id;
  }
  refreshSelectionVisuals();
  updateLayers();updateProperties();
}
function toggleMultiSelection(el){
  if(!el)return;
  if(selectedObjects.has(el))selectedObjects.delete(el);
  else selectedObjects.add(el);
  selected=[...selectedObjects].at(-1)||null;
  refreshSelectionVisuals();

}
function getSelectedObjects(){

["fill","stroke","strokeWidth","opacity","linecap","linejoin","dash","arrowStart","arrowEnd"].forEach(id=>{
  $(id).addEventListener("input",()=>{

function pointerDown(e){
  if(e.button!==0)return;
  const p=point(e);
  const target=e.target.closest("[data-id]");

  if(tool==="text"){openText(p);return}
  if(tool==="hand")return;

  if(tool==="select"){
    if(target&&objects.contains(target)){
      if(editorMode==="EDIT"){
        select(target);
        if(target.tagName.toLowerCase()==="path")drawNodes(target);
        else $("statusText").textContent="編集モードではパスを選択してください";
        return;
      }
      if(e.shiftKey){
        toggleMultiSelection(target);
        if(!selectedObjects.has(target))return;
      }else if(!selectedObjects.has(target)||selectedObjects.size>1){
        select(target);
      }
      const targets=getSelectedObjects();
      drag={type:"object",x:p.x,y:p.y,items:targets.map(el=>({el,oldTransform:el.getAttribute("transform")||""}))};
      svg.setPointerCapture(e.pointerId);
    }else if(!e.shiftKey){select(null);}
    return;
  }

  if(tool==="node"){
    if(target&&objects.contains(target)&&target.tagName.toLowerCase()==="path"){
      select(target);drawNodes(target);
    }else if(selected)drawNodes(selected);
    return;
  }

  if(tool==="polyline"){
    if(!preview){
      preview=make("path");
      preview.setAttribute("fill","none");
      preview.setAttribute("d",`M ${p.x} ${p.y}`);
      appendToActiveLayer(preview);
      points=[p];
    }else{
      points.push(p);
      updatePolyline();
    }
    return;
  }

  if(tool==="bezier"){
    if(!preview){
      preview=make("path");
      preview.setAttribute("fill","none");
      points=[{x:p.x,y:p.y,c1:null,c2:null}];
      appendToActiveLayer(preview);
      updateBezier();
    }else{
      points.push({x:p.x,y:p.y,c1:null,c2:null});
      updateBezier();
    }
    return;
  }

  drawing=true;start=p;
  points=[p];
  if(tool==="freehand"){
    preview=make("path");
    preview.setAttribute("fill","none");
    preview.setAttribute("d",`M ${p.x} ${p.y}`);
    appendToActiveLayer(preview);
  }else if(tool==="line"){
    preview=make("path");
    preview.setAttribute("fill","none");
    appendToActiveLayer(preview);
  }else if(tool==="rect"||tool==="ellipse"||tool==="star"){
    preview=make(tool==="rect"?"rect":tool==="ellipse"?"ellipse":"path");
    appendToActiveLayer(preview);
  }
  svg.setPointerCapture(e.pointerId);
}

function pointerMove(e){
  const p=point(e);
  if(drag&&drag.type==="object"){
    const dx=p.x-drag.x,dy=p.y-drag.y;
    drag.items.forEach(item=>item.el.setAttribute("transform",`translate(${dx} ${dy}) ${item.oldTransform}`.trim()));
    return;
  }
  if(nodeDrag&&selected){
    moveNode(p);
    return;
  }
  if(!drawing||!preview)return;

  if(tool==="freehand"){
    points.push(p);
    preview.setAttribute("d",points.map((q,i)=>(i?"L ":"M ")+q.x+" "+q.y).join(" "));
    return;
  }

  let x=p.x,y=p.y;
  if(e.shiftKey){
    const dx=x-start.x,dy=y-start.y;
    const angle=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
    const len=Math.hypot(dx,dy);
    x=start.x+Math.cos(angle)*len;
    y=start.y+Math.sin(angle)*len;
  }
  if(tool==="line"){
    preview.setAttribute("d",`M ${start.x} ${start.y} L ${x} ${y}`);
  }else if(tool==="rect"){
    preview.setAttribute("x",Math.min(start.x,x));
    preview.setAttribute("y",Math.min(start.y,y));
    preview.setAttribute("width",Math.abs(x-start.x));
    preview.setAttribute("height",Math.abs(y-start.y));
  }else if(tool==="ellipse"){
    preview.setAttribute("cx",(start.x+x)/2);
    preview.setAttribute("cy",(start.y+y)/2);
    preview.setAttribute("rx",Math.abs(x-start.x)/2);
    preview.setAttribute("ry",Math.abs(y-start.y)/2);
  }else if(tool==="star"){
    preview.setAttribute("d",starPath(start.x,start.y,Math.hypot(x-start.x,y-start.y)));
  }
}
function pointerUp(){
  if(drag){drag=null;snapshot();return}
  if(nodeDrag){nodeDrag=null;snapshot();return}
  if(!drawing)return;
  drawing=false;
  if(preview){
    select(preview);
    preview=null;
    snapshot();
  }
}
svg.addEventListener("pointerdown",pointerDown);
svg.addEventListener("pointermove",pointerMove);
svg.addEventListener("pointerup",pointerUp);
svg.addEventListener("pointercancel",pointerUp);

function starPath(cx,cy,r){
  let d="";
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5;
    const rr=i%2?r*.45:r;
    d+=(i?"L":"M")+(cx+Math.cos(a)*rr)+" "+(cy+Math.sin(a)*rr)+" ";
  }
  return d+"Z";
}
function updatePolyline(){
  if(!preview)return;
  preview.setAttribute("d",points.map((p,i)=>(i?"L ":"M ")+p.x+" "+p.y).join(" "));
}
function updateBezier(){
  if(!preview)return;
  let d=`M ${points[0].x} ${points[0].y}`;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i];
    if(a.c2||b.c1){
      const c1=a.c2||a,c2=b.c1||b;
      d+=` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
    }else d+=` L ${b.x} ${b.y}`;
  }
  preview.setAttribute("d",d);
}
function finishPath(){
  if(!preview)return;
  select(preview);
  preview=null;points=[];
  snapshot();
}
svg.addEventListener("dblclick",()=>{
  if(tool==="polyline"||tool==="bezier")finishPath();
});
function cancelPath(){
  if(preview){preview.remove();preview=null;points=[];drawing=false}
}

function drawNodes(el){
  overlay.innerHTML="";
  if(!el||el.tagName.toLowerCase()!=="path")return;
  const d=el.getAttribute("d")||"";
  const nums=d.match(/-?\d*\.?\d+/g)||[];
  for(let i=0;i+1<nums.length;i+=2){
    const c=document.createElementNS(svg.namespaceURI,"circle");
    c.setAttribute("cx",nums[i]);c.setAttribute("cy",nums[i+1]);
    c.setAttribute("r",5);c.setAttribute("class","node-handle");
    c.dataset.node=i/2;
    c.addEventListener("pointerdown",e=>{
      e.stopPropagation();
      nodeDrag={index:Number(c.dataset.node)};
      svg.setPointerCapture(e.pointerId);
    });
    overlay.append(c);
  }
}
function moveNode(p){
  if(!selected||!nodeDrag)return;
  const d=selected.getAttribute("d");
  const nums=d.match(/-?\d*\.?\d+/g)||[];
  const i=nodeDrag.index*2;
  if(i+1>=nums.length)return;
  nums[i]=p.x;nums[i+1]=p.y;
  let index=0;
  const newD=d.replace(/-?\d*\.?\d+/g,()=>nums[index++]);
  selected.setAttribute("d",newD);
  drawNodes(selected);
}

const LAYOUT_KEY="inkescape_layout_v2";

    outliner:{"--tool-width":"48px","--right-width":"350px","--outliner-height":"420px","--timeline-height":"88px"}
  };

(function restoreLayout(){

(function enableDockResizing(){
  let dragState=null;
  document.querySelectorAll(".dock-splitter[data-resize]").forEach(handle=>{
    handle.addEventListener("pointerdown",e=>{
      if(handle.offsetParent===null)return;
      const sidebar=$("sidebar");
      dragState={type:handle.dataset.resize,x:e.clientX,y:e.clientY,
        tool:parseFloat(getComputedStyle(layoutRoot).getPropertyValue("--tool-width"))||48,
        right:parseFloat(getComputedStyle(layoutRoot).getPropertyValue("--right-width"))||310,
        outliner:sidebar.querySelector(".outliner-panel")?.getBoundingClientRect().height||280,
        timeline:$("timeline")?.getBoundingClientRect().height||112,handle};
      handle.classList.add("dragging");handle.setPointerCapture(e.pointerId);e.preventDefault();
    });
    handle.addEventListener("pointermove",e=>{
      if(!dragState||dragState.handle!==handle)return;
      const dx=e.clientX-dragState.x,dy=e.clientY-dragState.y;
      if(dragState.type==="left")setLayoutVars({"--tool-width":Math.max(38,Math.min(120,dragState.tool+dx))+"px"});
      if(dragState.type==="right")setLayoutVars({"--right-width":Math.max(220,Math.min(580,dragState.right-dx))+"px"});
      if(dragState.type==="outliner")setLayoutVars({"--outliner-height":Math.max(100,Math.min($("sidebar").clientHeight-130,dragState.outliner+dy))+"px"});
      if(dragState.type==="timeline")setLayoutVars({"--timeline-height":Math.max(55,Math.min(330,dragState.timeline-dy))+"px"});
    });
    const stop=()=>{if(dragState?.handle===handle){handle.classList.remove("dragging");dragState=null;}};
    handle.addEventListener("pointerup",stop);handle.addEventListener("pointercancel",stop);
  });
})();

function findObjectById(id) {
  return [...objects.querySelectorAll("[data-id]")].find(el=>el.dataset.id===id) || null;
}
function renameObject(el){
  if(!el)return;
  const row=[...$("layers").querySelectorAll(".layer")].find(r=>r.dataset.objectId===el.dataset.id);
  const name=row?.querySelector(".layer-name");
  if(!name)return;
  const input=document.createElement("input");
  input.className="layer-name-input";
  input.value=el.dataset.name||el.tagName.toLowerCase();
  name.replaceWith(input);
  input.focus();input.select();
  let finished=false;
  const finish=save=>{
    if(finished)return;finished=true;
    const value=input.value.trim();
    if(save&&value){el.dataset.name=value;}
    updateLayers();
    if(save&&value)snapshot();
  };
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();finish(true);}
    if(e.key==="Escape"){e.preventDefault();finish(false);}
    e.stopPropagation();
  });
  input.addEventListener("blur",()=>finish(true));
}
function closeObjectMenu(){objectMenu.style.display="none";menuTarget=null;}
function openObjectMenu(button,el){
  menuTarget=el;
  const rect=button.getBoundingClientRect();
  objectMenu.style.display="block";
  const width=objectMenu.offsetWidth,height=objectMenu.offsetHeight;
  objectMenu.style.left=Math.max(6,Math.min(innerWidth-width,rect.right-width))+"px";
  objectMenu.style.top=Math.max(6,Math.min(innerHeight-height,rect.bottom+3))+"px";
}
objectMenu.addEventListener("click",e=>{
  const action=e.target.closest("button")?.dataset.action;
  const el=menuTarget;
  closeObjectMenu();
  if(!el||!action)return;
  if(action==="rename"){renameObject(el);return;}
  select(el);
  if(action==="duplicate"){duplicateSelected();return;}
  if(action==="delete"){
    removeObjectElement(el);
    if(selected===el||(selected&&el.contains(selected)))select(null);
    updateLayers();snapshot();
  }
});
document.addEventListener("pointerdown",e=>{
  if(objectMenu.style.display!=="none"&&!objectMenu.contains(e.target))closeObjectMenu();
});
window.addEventListener("resize",closeObjectMenu);

function updateLayers(){
  const root=$("layers");
  root.innerHTML="";
  function moveIntoFolder(dragged,folder){
    if(!dragged||!folder||dragged===folder||dragged.dataset.layerRoot==="true"||dragged.contains(folder))return;
    folder.appendChild(dragged);
    folder.dataset.collapsed="false";
    select(dragged);updateLayers();snapshot();
  }
  function renderItems(parent,container){
    [...parent.children].reverse().forEach(el=>{
      if(!el.dataset.id||el.dataset.guide==="true")return;
      const isFolder=el.dataset.folder==="true";
      const isGroup=el.tagName.toLowerCase()==="g";
      const hasTreeChildren=isGroup&&[...el.children].some(child=>child.dataset.id);
      const row=document.createElement("div");
      row.className="layer"+(isFolder?" folder":"")+(selectedObjects.has(el)?" selected multi-selected":"")+(el.dataset.layerRoot==="true"?" layer-root":"")+(el.dataset.layerRoot==="true"&&el.dataset.id===activeLayer?" active-layer":"");
      row.dataset.objectId=el.dataset.id;
      row.draggable=true;
      row.addEventListener("dragstart",e=>{
        e.dataTransfer.setData("text/plain",el.dataset.id);
        e.dataTransfer.effectAllowed="move";row.classList.add("dragging");
      });
      row.addEventListener("dragend",()=>{
        row.classList.remove("dragging");
        document.querySelectorAll(".drop-target").forEach(x=>x.classList.remove("drop-target"));
      });
      if(isFolder){
        row.addEventListener("dragover",e=>{e.preventDefault();e.stopPropagation();row.classList.add("drop-target");e.dataTransfer.dropEffect="move";});
        row.addEventListener("dragleave",e=>{if(!row.contains(e.relatedTarget))row.classList.remove("drop-target");});
        row.addEventListener("drop",e=>{
          e.preventDefault();e.stopPropagation();row.classList.remove("drop-target");
          moveIntoFolder(findObjectById(e.dataTransfer.getData("text/plain")),el);
        });
      }
      if(isFolder){
        const toggle=document.createElement("button");
        toggle.className="folder-toggle";
        const collapsed=el.dataset.collapsed==="true";
        toggle.textContent=collapsed?"▸":"▾";
        toggle.title=collapsed?"フォルダを開く":"フォルダを閉じる";
        toggle.onclick=()=>{el.dataset.collapsed=collapsed?"false":"true";updateLayers();snapshot();};
        row.append(toggle);
      }else{
        const spacer=document.createElement("span");spacer.style.width="25px";spacer.style.flexShrink="0";row.append(spacer);
      }
      const eye=document.createElement("button");
      eye.textContent=el.style.display==="none"?"○":"◉";eye.title="表示・非表示";
      eye.onclick=()=>{el.style.display=el.style.display==="none"?"":"none";updateLayers();snapshot();};
      const name=document.createElement("span");
      name.className="layer-name";
      name.textContent=(el.dataset.layerRoot==="true"?"▣ ":isFolder?"▰ ":isGroup?"▱ ":"◇ ")+(el.dataset.name||el.tagName.toLowerCase());
      name.title="ダブルクリックで名前を変更";
      name.onclick=e=>{if(editorMode==="OBJECT"&&e.shiftKey)toggleMultiSelection(el);else select(el);if(el.dataset.layerRoot==="true")snapshot();};
      name.ondblclick=e=>{e.stopPropagation();select(el);renameObject(el);};
      const menu=document.createElement("button");
      menu.className="layer-menu";menu.textContent="⋮";menu.title="オブジェクトメニュー";
      menu.onclick=e=>{e.stopPropagation();openObjectMenu(menu,el);};
      row.append(eye,name,menu);
      container.append(row);
      if(isFolder||hasTreeChildren){
        const children=document.createElement("div");children.className="layer-children";
        const collapsed=isFolder&&el.dataset.collapsed==="true";
        if(collapsed)children.style.display="none";
        container.append(children);
        renderItems(el,children);
      }
    });
  }
  renderItems(objects,root);
  // 一覧の空白にドロップしたらフォルダの外（最上位）へ戻す
  root.ondragover=e=>{if(e.target.closest(".layer.folder"))return;e.preventDefault();e.dataTransfer.dropEffect="move";};
  root.ondrop=e=>{
    if(e.target.closest(".layer.folder"))return;
    e.preventDefault();
    const dragged=findObjectById(e.dataTransfer.getData("text/plain"));
    if(!dragged||dragged.dataset.layerRoot==="true"||dragged.parentNode===getActiveLayerGroup())return;
    getActiveLayerGroup().appendChild(dragged);select(dragged);updateLayers();snapshot();
  };
}
function addLayer(){
  const count=[...objects.children].filter(el=>el.dataset.layerRoot==="true").length+1;
  const group=createLayerGroup("レイヤー "+count);
  objects.append(group);
  activeLayer=group.dataset.id;
  layers.push({id:group.dataset.id,name:group.dataset.name,visible:true});
  select(group);updateLayers();snapshot();
}
/* =====================================
   Inkescape フォルダ管理
===================================== */

// フォルダ作成
function addFolder() {
  const folder = document.createElementNS(
    svg.namespaceURI,
    "g"
  );

  const id = "folder-" + (++objectCounter);

  folder.dataset.id = id;
  folder.dataset.name = "新しいフォルダ";
  folder.dataset.folder = "true";
  folder.dataset.collapsed = "false";
  folder.dataset.layer = activeLayer || "default";

  getActiveLayerGroup().append(folder);

  select(folder);
  updateLayers();
  snapshot();
}
function groupSelected(){
  if(!selected||selected.dataset.layerRoot==="true")return;
  const parent=selected.parentNode;
  const g=document.createElementNS(svg.namespaceURI,"g");
  g.dataset.id="group-"+(++objectCounter);
  g.dataset.name="グループ "+objectCounter;
  parent.insertBefore(g,selected);
  g.append(selected);
  select(g);snapshot();
}
function ungroupSelected(){
  if(!selected||selected.tagName.toLowerCase()!=="g"||selected.dataset.layerRoot==="true")return;
  const g=selected;
  const parent=g.parentNode;
  while(g.firstChild)parent.insertBefore(g.firstChild,g);
  g.remove();select(null);snapshot();
}
function alignSelected(mode){
  if(!selected)return;
  const b=selected.getBBox();
  const page=svg.viewBox.baseVal;
  let dx=0,dy=0;
  if(mode==="left")dx=-b.x;
  if(mode==="center")dx=page.width/2-(b.x+b.width/2);
  if(mode==="right")dx=page.width-b.x-b.width;
  if(mode==="top")dy=-b.y;
  if(mode==="middle")dy=page.height/2-(b.y+b.height/2);
  if(mode==="bottom")dy=page.height-b.y-b.height;
  const old=selected.getAttribute("transform")||"";
  selected.setAttribute("transform",`translate(${dx} ${dy}) ${old}`.trim());
  snapshot();
}
function removeObjectElement(el){
  if(!el)return;
  if(el.dataset.layerRoot==="true"){
    const roots=[...objects.children].filter(item=>item.dataset.layerRoot==="true");
    if(roots.length<=1){
      el.replaceChildren();
      activeLayer=el.dataset.id;
    }else{
      const next=roots.find(item=>item!==el);
      el.remove();
      if(activeLayer===el.dataset.id)activeLayer=next?.dataset.id||null;
    }
    layers=layers.filter(layer=>layer.id!==el.dataset.id);
  }else el.remove();
}

function deleteSelected(){
  const targets=getSelectedObjects();
  if(!targets.length)return;
  // 親グループとその子が同時選択されている場合は親だけ削除する
  const topLevel=targets.filter(el=>!targets.some(other=>other!==el&&other.contains(el)));
  topLevel.forEach(removeObjectElement);
  select(null);updateLayers();snapshot();
}
function duplicateSelected(){
  if(!selected||selected.dataset.layerRoot==="true")return;
  const clone=selected.cloneNode(true);
  clone.dataset.id="object-"+(++objectCounter);
  clone.dataset.name=(selected.dataset.name||"Object")+" コピー";
  const old=clone.getAttribute("transform")||"";
  clone.setAttribute("transform",`translate(20 20) ${old}`.trim());
  selected.after(clone);select(clone);snapshot();
}
function moveOrder(direction){
  if(!selected)return;
  const parent=selected.parentNode;
  if(direction>0)parent.append(selected);
  else parent.insertBefore(selected,parent.firstChild);
  updateLayers();snapshot();
}
function applyGeometry(){
  if(!selected)return;
  const b=selected.getBBox();
  const x=Number($("posX").value),y=Number($("posY").value);
  const w=Math.max(1,Number($("objW").value));
  const h=Math.max(1,Number($("objH").value));
  const sx=w/(b.width||1),sy=h/(b.height||1);
  const old=selected.getAttribute("transform")||"";
  selected.setAttribute("transform",
    `translate(${x-b.x*sx} ${y-b.y*sy}) scale(${sx} ${sy}) ${old}`.trim());
  snapshot();
}
function applyGradient(){
  if(!selected)return;
  const id="gradient-"+Date.now();
  const g=document.createElementNS(svg.namespaceURI,"linearGradient");
  g.id=id;
  g.setAttribute("x1","0%");g.setAttribute("y1","0%");
  g.setAttribute("x2","100%");g.setAttribute("y2","100%");
  for(const [offset,color] of [["0%",$("gradA").value],["100%",$("gradB").value]]){
    const stop=document.createElementNS(svg.namespaceURI,"stop");
    stop.setAttribute("offset",offset);stop.setAttribute("stop-color",color);
    g.append(stop);
  }
  defs.append(g);
  selected.setAttribute("fill",`url(#${id})`);
  snapshot();
}
function resizePage(){
  const w=Math.max(1,Number($("pageW").value));
  const h=Math.max(1,Number($("pageH").value));
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  $("stage").style.width=w+"px";
  $("stage").style.height=h+"px";
  snapshot();
}
function changeZoom(n){
  zoom=Math.max(.2,Math.min(3,zoom+n));
  $("stage").style.transform=`translate(-50%,-50%) scale(${zoom})`;
  $("zoom").value=Math.round(zoom*100)+"%";
}
function newDocument(){
  if(!confirm("現在の作品を消去しますか？"))return;
  objects.innerHTML="";layers=[];activeLayer=null;overlay.innerHTML="";defs.querySelectorAll("linearGradient").forEach(x=>x.remove());
  ensureLayerStructure();select(null);snapshot();
}
function download(data,name,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function saveSVG(){
  const clone=svg.cloneNode(true);
  clone.querySelector("#overlay")?.remove();
  clone.querySelectorAll(".selected-object").forEach(x=>x.classList.remove("selected-object"));
  const data=new XMLSerializer().serializeToString(clone);
  download(data,"inkescape-art.svg","image/svg+xml");
}
function exportPNG(){
  const clone=svg.cloneNode(true);
  clone.querySelector("#overlay")?.remove();
  const data=new XMLSerializer().serializeToString(clone);
  const url=URL.createObjectURL(new Blob([data],{type:"image/svg+xml"}));
  const img=new Image();
  img.onload=()=>{
    const vb=svg.viewBox.baseVal;
    const c=document.createElement("canvas");
    c.width=vb.width*2;c.height=vb.height*2;
    const ctx=c.getContext("2d");
    ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(blob=>{
      download(blob,"inkescape-art.png","image/png");
      URL.revokeObjectURL(url);
    });
  };
  img.onerror=()=>{alert("PNGに変換できませんでした");URL.revokeObjectURL(url)};
  img.src=url;
}
function openText(p){
  textPosition=p;
  $("textDialog").style.display="flex";
  $("textInput").value="";
  $("textInput").focus();
}
function closeText(){$("textDialog").style.display="none"}
function createText(){
  const value=$("textInput").value;
  if(!value.trim())return;
  const el=make("text",{x:textPosition.x,y:textPosition.y});
  el.textContent=value;
  el.setAttribute("font-size","32");
  el.setAttribute("font-family","sans-serif");
  appendToActiveLayer(el);select(el);snapshot();closeText();
}
$("importFile").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const data=await file.text();
    const doc=new DOMParser().parseFromString(data,"image/svg+xml");
    if(doc.documentElement.tagName.toLowerCase()!=="svg")throw Error("SVG形式ではありません");
    const incoming=doc.documentElement;
    objects.innerHTML="";
    activeLayer=null;
    ensureLayerStructure();
    defs.innerHTML=incoming.querySelector("defs")?.innerHTML||"";
    const group=incoming.querySelector("g")||incoming;
    [...group.children].forEach(el=>{
      if(el.tagName.toLowerCase()!=="defs")appendToActiveLayer(document.importNode(el,true));
    });
    if(incoming.getAttribute("viewBox"))svg.setAttribute("viewBox",incoming.getAttribute("viewBox"));
    select(null);snapshot();updateLayers();
  }catch(err){alert("読み込みエラー: "+err.message)}
  e.target.value="";
});
window.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(e.ctrlKey||e.metaKey){
    if(e.key.toLowerCase()==="a"&&editorMode==="OBJECT"){
      e.preventDefault();
      const roots=[...objects.children].filter(el=>el.dataset.layerRoot==="true");
      const candidates=roots.length?roots.flatMap(root=>[...root.children]):[...objects.children];
      selectedObjects=new Set(candidates.filter(el=>el.dataset.id&&el.dataset.guide!=="true"));
      selected=[...selectedObjects].at(-1)||null;
      refreshSelectionVisuals();updateLayers();updateProperties();
      return;
    }
    if(e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
    if(e.key.toLowerCase()==="y"){e.preventDefault();redo()}
    if(e.key.toLowerCase()==="s"){e.preventDefault();saveSVG()}
    if(e.key.toLowerCase()==="d"){e.preventDefault();duplicateSelected()}
    return;
  }
  const keys={v:"select",n:"node",l:"line",p:"freehand",b:"bezier",r:"rect",e:"ellipse",t:"text"};
  if(keys[e.key.toLowerCase()])setTool(keys[e.key.toLowerCase()]);
  if(e.key==="Delete"||e.key==="Backspace")deleteSelected();
  if(e.key==="Escape")cancelPath();
});
const restored = loadDrawing();
ensureLayerStructure();
updateLayers();
setMode("OBJECT");
snapshot();
</script>
